# Authentic Suffering — install config (docs/as/11_SETTINGS.md §2).
# Copy to as_config.yaml (tools/as/setup.py does it) and edit. as_config.yaml is git-ignored.
# Validated by as_engine.config_loader.load_engine_config: an unknown key is an error that names it.
# Anything you leave out keeps its default (contracts/settings.py::EngineConfig).
schema: as.config.v1
runs_dir: as_runs                  # saves, reports, logs (relative to this file)
content_dir: as_content/packs      # content packs
compiled_dir: as_content/_compiled # compiled canon cache

# Both models are picked from ONE list: the LM Studio server on this machine. With LM Link on, the
# other machine's models are in that list too, so both lanes use the same address. The easy way to
# choose is the game's Connect / Settings → Models screen; you should not need to edit this block.
# The game only talks to models on this machine or your home network (the seal, 02 §9): an address
# anywhere else is refused and the config does not load.
lanes:
  A:   # the main model, the Writer: the thinking decisions of the people who matter most, the narration and every
       # other piece of prose (D-111, 08 §2)
    name: Main model — the Writer (Boulesis v2.1 26B-A4B, a Gemma 4)
    base_url: http://localhost:1234/v1        # the LM Studio server on this machine
    model: boulesis-v2.1-26b-a4b-i1           # the exact model id LM Studio lists (tools/as/doctor.py --lanes shows them)
    api_key: lm-studio
    max_concurrency: 1
    stall_window_s: 300                       # LANE-10: a call is stopped only if it makes NO progress (no token, no reasoning)
                                              # for this long. There is no limit on total time: a model may think for ten minutes.
    silent_prefill_window_s: 0                # 0 = wait without limit while the server reads a long prompt and says nothing
    prefill_progress: unknown                 # tools/as/probe.py --write: does the server report prompt-processing progress?
    thinking_mode: native                     # tools/as/probe.py picks: native | system_no_think | chat_template_kwargs | prefill_empty_think
                                              # | system_think_token (Gemma 4: thinks only when <|think|> opens the system prompt) | none
    structured_mode: json_schema              # json_schema | prompt_only
    structured_with_thinking: unknown         # probe writes supported | unsupported
  B:   # the second model, the Clerk: intake, the other minds, memory, the checks and audits — closed answers code can check
    name: Second model — the Clerk (Nemotron 3.5 Lightning 30B-A3B)
    base_url: http://localhost:1234/v1        # the same list, via LM Link (without LM Link: that machine's own address)
    model: nvidia-nemotron-3.5-lightning-30b-a3b-mtp
    api_key: lm-studio
    max_concurrency: 1                        # more parallel slots here = more people per turn get a model call
    stall_window_s: 300                       # LANE-10: a call is stopped only if it makes NO progress (no token, no reasoning)
                                              # for this long. There is no limit on total time: a model may think for ten minutes.
    silent_prefill_window_s: 0                # 0 = wait without limit while the server reads a long prompt and says nothing
    prefill_progress: unknown                 # tools/as/probe.py --write: does the server report prompt-processing progress?
    thinking_mode: native
    structured_mode: json_schema
    structured_with_thinking: unknown

hot_cognition:        # the HOT actor call: the Writer, thinking on (D-111). lane: B puts it on the Clerk
  lane: A
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096            # thinking counts against it
  thinking: true
  deadline_s: 75              # the EXPECTED seconds (reported "slow" past it); it never cuts a call off (LANE-10)

background_cognition: true   # reflection / scene summaries while you read

