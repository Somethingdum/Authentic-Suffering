# P9 society fixture (PROTECTED): ECON-01, SOC-01..03, DEMO-01. A 24-person settlement around a
# water pump: 23 fixture-stub people plus the PC. The pump is balanced on a knife edge: two cycles a
# day at 31 water each = 62/day, exactly the settlement's consumption at 06_WORLD.md §2.4 rates
# (19 people at adult rates — adults, elders, the preteen and the teen — x 3, 3 children x 1,
# 2 infants x 1 = 62), and the store holds 192 (3.1 days). One missed pump shift drops the store
# under 3 days -> SHORTAGE -> ration cut -> household tension. The ECON-01 test injures Hal's arm
# and lets the world run; nothing else is scripted. Everyone but the PC (a newcomer) has a household
# and so a bunk to sleep in (P9 routines); the single adults are households of one.
