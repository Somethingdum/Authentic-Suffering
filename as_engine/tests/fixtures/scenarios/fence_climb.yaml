# P7 fixture (PROTECTED): a failed climb, committed and narrated (docs/as/13_BUILD_ORDER.md §5.7
# "Actions fail"). Owen tries to go over a high chain-link fence at the back of a yard. The fence is
# 250 cm (obstacle class 5, 07_RULES.md §1.2), so even a fit man usually cannot; with this seed
# the first check of the run fails. Ada, a neighbour mending a bucket, watches from the porch.
schema: as.scenario.v1
name: fence_climb
description: A high fence, a man who thinks he can climb it, and a neighbour who sees him fail.
seed: 7
start: {day: 40, time: "15:00:00"}
weather: {kind: clear}
places:
  - id: yard
    name: Back yard
    kind: outdoor
    indoor: false
    material: open_air
    width_m: 12
    depth_m: 8
    ambient_db: 35
    anchors:
      - {id: fence_near, name: foot of the fence, kind: feature, x: 6, y: 7.7}
      - {id: porch, name: back porch, kind: furniture, x: 2, y: 1}
      - {id: shed, name: shed, kind: cover, x: 10, y: 3, cover: 2, concealment: 2}
  - id: lot
    name: Empty lot
    kind: outdoor
    indoor: false
    material: open_air
    width_m: 20
    depth_m: 10
    ambient_db: 35
    anchors:
      - {id: fence_far, name: far side of the fence, kind: feature, x: 6, y: 0.3}
portals:
