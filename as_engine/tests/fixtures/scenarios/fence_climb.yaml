    dossier: core:pc/owen_marsh
    controller: human
    place: yard
    anchor: fence_near
  - id: ada
    stub: {name: Ada Brooks, age: 61, sex: female, occupation: retired nurse}
    place: yard
    anchor: porch
    task: {kind: mend, label: mending a bucket, steps_total: 40, steps_done: 3, step_s: 30, interrupt_on: [loud_noise]}
knows:
  - {holder: pc, subject: ada, name: Ada}
  - {holder: ada, subject: pc, name: Owen}
notes:
