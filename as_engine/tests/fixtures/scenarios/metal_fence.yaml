# (a lapse Ray would not allow). With RulesConfig defaults the 98 dB gust crash at the fence sheet
# reaches everyone awake EXACT through the open back door; Eli, asleep behind a boarded window
# (seal 20), receives ~60 dB >= the 55 dB sleeper threshold -> TONE_ONLY and wakes; the stranger,
# right behind the chain-link fence, EXACT. June's raised call from the storeroom doorway reaches
# Nita PARTIAL and the stranger TONE_ONLY (a voice, not words). Hand arithmetic for every listener:
# tests/fixtures/vectors/acoustics.json (entries 'metal_fence_*').
