# "Up and away" — Addison's rooftops (D-108). PROTECTED. A block of Hardy Street, Hattiesburg,
# about nine years after the Fall. Addison Flores is on the market roof at the top of the drainpipe
# she came up; one of the dead is at its foot, and a runner is in the street. The market roof
# (4.5 m) is 1.6 m from the warehouse roof (6 m), which is 2.8 m from the apartment roof (6.5 m);
# the apartments have a fire escape anyone can walk. Checks by hand (07_RULES §1, 13 §4 D-108):
# Addison A 9 (+5), athletics 3, parkour +2 -> 10 before resistance, clamped to 9.
