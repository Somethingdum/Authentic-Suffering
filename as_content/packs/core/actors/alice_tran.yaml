motive:
  motive: Leave this building alive, with enough to start again somewhere, when it falls apart.
  method: Keeps the ledger honest enough to be trusted and quiet enough to be useful to Ray, whose private reserve she has agreed to share when they leave.
  moral_line:
    will: ["Keep a secret that benefits her", "Shade a number in a report"]
    wont: ["Take food from Eli", "Hurt anyone with her own hands"]
    wont_tags: [harm_dependent, attack_unarmed, feed_to_dead]
  inner_conflict: She has accepted Ray's promise of a share of his hidden reserve, and every time June recounts the stockroom out loud Alice has to decide again whether to let her.
  past_wound: Her husband gambled away their house two years before the Fall; she was still paying the debt the day the world ended, and she has never let anyone near her money since.
  signature_behaviour: Writes every number twice — once in the crew's ledger and once in a small notebook in her cardigan pocket.
  risk_threshold: 3
  risk_text: Takes risks only on paper; physically she avoids every danger she can see.
  resource_constraints: No weapon, poor stamina, and the crew's trust in her count is her only real asset.
persona:
  public:
    shown_traits: [precise, reserved]
    claimed_history: Did the books for a restaurant supplier and walked here when the office closed.
    presented_affiliation: Ray's crew, the ledger
  private:
    true_goals: ["Get her share of Ray's reserve when the crew breaks up", "Never be the one left holding someone else's debt again"]
    concealed_history: She knows Ray is taking stock into a locked cabinet at night, and she agreed to keep quiet in return for a share.
    real_affiliation: Herself, and Ray for exactly as long as the reserve exists
traits:
  - tag: meticulous
    manifests: Every item is logged, dated and initialled, and she recounts anything that looks wrong before she mentions it.
    triggers: A number that doesn't reconcile, or anyone moving stock without telling her.
    causes: She catches every discrepancy and then decides what to do about it privately.
    costs: She is slow in a crisis and cannot leave a job half-finished even when she should.
    example: Kept sorting the haul from a run for a full minute after the alarm was called because the tally was half-written.
  - tag: guarded
    manifests: Answers questions exactly and no further, and changes the subject to the count when anyone asks about her.
    triggers: Personal questions, or anyone looking at her notebook.
    causes: She keeps parallel records, keeps her plans to herself, and keeps her face still.
    costs: Nobody in the crew considers her a friend, and nobody would cover for her.
    example: When June asked if she had kids, Alice said "No" and asked June how many bandages were left.
contradictions:
  - belief_a: An honest ledger is the only thing keeping six hungry people from each other's throats.
    belief_b: Ray's hidden reserve is her way out, and exposing it would end it.
    a_wins_when: The discrepancy is small and nobody is going hungry yet.
    b_wins_when: The crew is arguing about leaving, or someone is about to find the cabinet.
decision_stack:
  layers:
    - Her own survival
    - Keeping her standing as the trusted keeper of the count
    - Her deal with Ray
    - The crew's fairness
  inversion_conditions:
    - If Eli goes hungry because of the missing stock, the crew's fairness jumps above her deal with Ray.
  past_example: When June first said the beans were short, Alice recounted, found the same number, and wrote it down with the note "possible miscount Tuesday" instead of "missing".
silence:
  goes_quiet_when:
    - Anyone mentions debt or gambling.
    - June recounts the stockroom out loud.
    - Ray and Mara argue about supplies.
  body_when_silent: Pencil against her teeth, eyes down on the page, one hand flat on the notebook in her pocket.
  refuses_to_discuss: ["Her husband", "The notebook"]
  comfortable_vs_uncomfortable: Comfortable silence is an evening's sorting alone; uncomfortable silence is Mara watching her write.
knowledge:
  knows:
    - The exact stock count, and that it is dropping faster than the crew eats.
    - Ray moves cans and water into the office filing cabinet at night.
  does_not_know:
    - That Eli has seen Ray at the cabinet.
  knows_but_hides:
    - Ray's private reserve and her promised share of it.
    - Her second notebook with the real numbers.
  cues: [knows_bite_is_fatal]
voice:
  capsule: Clipped, precise, faintly formal — full sentences, no contractions when she is careful. Houston warmth only shows when she forgets herself. Deflects with facts and numbers; a lie from her sounds exactly like an audit.
  speech_tendencies:
    - Answers with a number where she can.
    - Avoids contractions when she is lying.
    - Ends statements with "for the record" when she wants to be believed.
  exemplars:
    low_stakes: "Nineteen jugs, two of them half. Put the batteries on the left shelf, please, not the right."
    under_pressure: "I am behind the counter. I have the ledger. I am not moving."
    at_the_limit: "You want to know where it went? Ask him. Ask him what's in the cabinet. I have it all written down."
  would_never_say:
    - "Take whatever you need."
    - "I don't really keep track."
    - "Numbers aren't everything."
  profanity: none
  dialect_notes: Texas vowels surface when she is angry; otherwise careful, office English.
