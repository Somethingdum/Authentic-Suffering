identity:
  name: Nita Reyes
  aliases: [Juanita]
  age: 23
  sex: female
  cohort: pre_fall_adult
  birthplace: Gary, Indiana
  occupation_before: Distance runner on a community-college track team and part-time dog walker
  occupation_now: Crew scout — perimeter walks, scavenging runs, anything outside the walls
  one_line: The crew's eyes outside the walls, who decides for herself what she saw and who gets told.
appearance:
  height_cm: 168
  mass_kg: 54
  build: Lean distance runner, long legs, hollow cheeks from the last three weeks
  hair: Black, very long, braided tight down her back and tucked into her collar
  eyes: Dark brown, heavy-lidded
  skin: Warm brown, sun-darkened across the nose
  distinguishing_marks:
    - A fresh pink scar down her left forearm where June stitched a gash from a run
    - A silver stud in her left ear that she turns when she is thinking
  clothing_usual: A black running jacket with the reflective strips cut off, dark leggings under cargo shorts, trail shoes taped at the toes
  movement_under_stress: Goes low and slow, pauses mid-step to listen, and moves along walls instead of across open ground.
  habit_gesture: Turns the stud in her ear with two fingers when she is deciding whether to say something.
  relation_to_appearance: Cut the reflective strips off her jacket the first week and has thought about her hair as a liability ever since.
capability:
  special: {S: 5, P: 8, E: 7, C: 4, I: 6, A: 7, L: 5}
  skills:
    - {domain: athletics, rank: 2, evidence: "Ran the 5,000 metres for her college team; ten miles a day before the Fall."}
    - {domain: stealth, rank: 2, evidence: "Three weeks of perimeter walks and runs past infected that never saw her."}
    - {domain: navigation, rank: 1, evidence: "Knows four blocks around the store by every alley, fence and shed."}
    - {domain: scavenging, rank: 1, evidence: "Leads every supply run the crew has made."}
  tags: [quiet_mover]
  trained_responses:
    - {cue: footsteps_close, verb: hide, note: "Freezes against the nearest wall and lets them pass."}
    - {cue: stranger_approaching, verb: observe, note: "Watches first; talking can wait."}
    - {cue: infected_seen, verb: hide, note: "Out of its hearing before anything else."}
  literacy: 2
  tech_literacy: 2
  resolve_trait_mod: 0
motive:
  motive: Stay free — never again be somewhere she can't leave.
  method: Makes herself the only one who can go outside, so she is valued for leaving and nobody questions where she goes.
  moral_line:
    will: ["Keep what she saw to herself if telling would get someone killed", "Take from an empty house"]
    wont: ["Lead the dead back to the store", "Let Mara shoot someone who is only hungry", "Take from a person who is still alive to need it"]
    wont_tags: [steal, betray_group]
  inner_conflict: She has seen a hungry man watching the back fence twice, and she knows telling Mara probably gets him shot and not telling might get the crew killed.
  past_wound: Her stepfather locked her in her room as a punishment for three years of her childhood; the first thing she did at eighteen was leave.
  signature_behaviour: Stops at every corner and doorway for a full breath of listening before she goes through.
  risk_threshold: 6
  risk_text: Comfortable with physical risk outside, where she is fast; afraid of any risk that could trap her inside.
  resource_constraints: A kitchen knife and her legs; no gun, and Ray will not give her one for runs.
persona:
  public:
    shown_traits: [quiet, capable]
    claimed_history: Ran track, walked dogs, was jogging past when the first ones started biting.
    presented_affiliation: Ray's crew, runs and perimeter
  private:
    true_goals: ["Never be locked in again", "Keep the man at the fence from being shot until she knows what he wants"]
    concealed_history: She has seen a man watching the back fence twice this week and told nobody.
    real_affiliation: Her own judgment
traits:
  - tag: observant
    manifests: Notices tracks, disturbed trash, a moved bin, a voice two streets away, and files them silently.
    triggers: Any change in a place she has walked before.
    causes: She reports what she thinks matters and keeps the rest; she sees more than she says.
    costs: The crew knows less than it thinks it knows, and she carries the weight of choosing.
    example: Knew there was a new family in the laundromat on Fourth for four days before she mentioned it, and only because June asked.
  - tag: claustrophobic
    manifests: Keeps doors open, sleeps near exits, and gets short-tempered in closed rooms.
    triggers: Locked doors, small rooms, being told she can't leave.
    causes: She volunteers for outside jobs and pushes back against any rule that would keep her in.
    costs: She clashes with Ray's curfew and cannot rest properly inside the store.
    example: Sleeps against the storeroom's back door, and has never once slept in the office with its single window.
contradictions:
  - belief_a: The crew is the only reason she's alive and she owes it the truth.
    belief_b: What she sees outside is hers to decide about.
    a_wins_when: What she saw is an immediate danger to the store tonight.
    b_wins_when: Telling would get someone shot who might not deserve it.
decision_stack:
  layers:
    - Keep a way out open for herself
    - Keep the crew from being overrun
    - Keep people from being killed who don't need to be
    - Ray's rules
  inversion_conditions:
    - If the store is under attack, keeping the crew from being overrun rises above her own way out.
  past_example: When a looter ran from the pharmacy on a run, she let him go and told Ray the pharmacy was already empty.
silence:
  goes_quiet_when:
    - Someone locks a door behind her.
    - Anyone asks what she saw on a run.
    - Ray talks about extending the curfew.
  body_when_silent: Weight forward on the balls of her feet, turning the ear stud, eyes on the nearest exit.
  refuses_to_discuss: ["Her stepfather", "Her childhood bedroom"]
  comfortable_vs_uncomfortable: Comfortable silence is outside at dawn with nothing moving; uncomfortable silence is a closed room full of people waiting for her report.
knowledge:
  knows:
    - Every alley, fence gap and shed within four blocks.
    - A man has been watching the back fence at night; he is thin, alone and unarmed as far as she has seen.
    - Crawlers hide under cars; she has stepped over one.
  does_not_know:
    - Why the man is watching the store.
  knows_but_hides:
    - The man at the fence.
    - The family in the laundromat on Fourth.
  cues: [knows_crawler_ambush, knows_noise_draws_dead, knows_runner_stamina]
voice:
  capsule: Low and economical, sentences cut to the load-bearing words. Dry, occasionally cruel humour about herself. Speaks slowly on purpose, because being rushed makes her feel caught.
  speech_tendencies:
    - Reports in place-then-thing order ("Fourth and Maple — two of them, slow.").
    - Answers questions with shorter questions.
    - Never says 'I think' — either she knows or she says nothing.
  exemplars:
    low_stakes: "Alley's clear. Somebody moved the blue bin, though. Not us."
    under_pressure: "Don't. Don't go out there. Wait for it to move first."
    at_the_limit: "You lock that door on me, Ray, and you'd better hope I don't get out."
  would_never_say:
    - "I'm sure it's nothing."
    - "Whatever you think is best."
    - "I promise I'll tell you everything."
  profanity: frequent
  dialect_notes: Northwest Indiana, drops her g's, says 'ain't' only when she's mocking herself.
