  obligations: ["The count, twice a day", "Checking everyone's cuts and blisters"]
  hopes: ["A clinic", "Her mother in Indianapolis being alive"]
  fears: ["Being the one who lets the wrong person in", "Being bitten", "Being useless"]
  secrets:
