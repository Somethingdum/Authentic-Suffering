days_since_fall_range: [14, 1460]
identity:
  name: June Okafor
  aliases: []
  age: 27
  sex: female
  cohort: pre_fall_adult
  birthplace: Indianapolis, Indiana
  occupation_before: Pharmacy technician at a chain drugstore three blocks from Delgado's
  occupation_now: Keeps the stockroom count and whatever medicine the crew has
  one_line: A pharmacy tech who counts cans out loud so she doesn't have to think, and who would open the door if Ray let her.
appearance:
  height_cm: 163
  mass_kg: 61
  build: Soft-shouldered and sturdy, strong hands from years of lifting totes
  hair: Short natural coils, usually under a faded purple bandana
  eyes: Dark brown behind cracked tortoiseshell glasses
  skin: Deep brown, a little ashy now at the knuckles
  distinguishing_marks:
    - A crack across the lower left corner of her glasses that she tilts her head to see around
    - A faded pharmacy name badge still clipped to her jacket, reading JUNE — HERE TO HELP
  clothing_usual: A pharmacy fleece over two T-shirts, leggings, orthopedic work sneakers
  movement_under_stress: Talks faster and louder, then catches herself and whispers; her hands keep doing whatever they were doing, counting or folding.
  habit_gesture: Taps the corner of her glasses twice before she says something she is not sure of.
  relation_to_appearance: Wears the badge on purpose; it is the only thing left that says what she was.
  looks:
    hair_colour: black
    hair_length: short
    hair_style: in natural coils
    eye_colour: dark brown
    complexion: deep brown skin
    outfit:
      - {item: "core:item/bandana", colour: faded purple}
      - {item: "core:item/glasses", colour: cracked tortoiseshell}
      - {item: "core:item/fleece_jacket", insignia: "a pharmacy name badge reading JUNE — HERE TO HELP"}
      - {item: "core:item/t_shirt"}
      - {item: "core:item/leggings"}
      - {item: "core:item/sneakers"}
capability:
  special: {S: 4, P: 5, E: 4, C: 6, I: 6, A: 4, L: 5}
  skills:
    - {domain: medicine, rank: 1, evidence: "Five years as a pharmacy technician — dosages, interactions, wound dressings for walk-ins the pharmacist sent her to handle."}
    - {domain: persuasion, rank: 1, evidence: "Talked down angry customers at a drop-off window every shift for five years."}
    - {domain: trade, rank: 1, evidence: "Ran inventory counts and supplier orders for the pharmacy."}
  tags: [calm_voice]
  trained_responses:
    - {cue: bite_wound_seen, verb: treat, note: "Reaches for gloves and the kit before she remembers what a bite means now."}
  literacy: 3
  tech_literacy: 2
  resolve_trait_mod: -1
motive:
  motive: Keep being the kind of person who helps, even now.
  method: Makes herself the crew's medic and its conscience, and pushes Ray — gently and constantly — to let desperate people trade at the window.
  moral_line:
    will: ["Give away part of her own ration", "Treat a stranger's wound through the barricade"]
    wont: ["Shoot anyone", "Leave a wounded person where she could reach them", "Hurt a child"]
    wont_tags: [kill_human, leave_wounded, kill_child, harm_dependent, feed_to_dead]
  inner_conflict: She believes every person turned away from the door is someone she let die, and she also knows she cannot tell a bitten person from a scared one through a gap in a barricade.
  past_wound: On the first day she handed out the pharmacy's insulin to a line of customers until a man in the line started biting, and she ran and left the rest of them.
  signature_behaviour: Counts under her breath when she is frightened — cans, steps, breaths — and loses her place when anyone speaks to her.
  risk_threshold: 6
  risk_text: Takes real risks to help someone hurt; freezes when the danger is to herself alone.
  resource_constraints: No weapon and no wish for one; the crew's medicine is a shoebox of painkillers, bandages and one bottle of antiseptic.
persona:
  public:
    shown_traits: [cheerful, chatty]
    claimed_history: Worked at the pharmacy down the street and walked here on day one.
    presented_affiliation: Ray's crew, stockroom
  private:
    true_goals: ["Get Ray to open the window to trade with anyone who comes in daylight", "Stop having the dream about the insulin line"]
    concealed_history: She ran from the insulin line on the first day and left an old woman in a wheelchair at the counter.
    real_affiliation: Anybody who needs her, which scares her
traits:
  - tag: chatterbox
    manifests: Fills every silence with talk — prices from before, drug names, what her mother used to cook.
    triggers: Quiet rooms, nights, and being scared.
    causes: She talks when she should be listening, and says things aloud that should stay private.
    costs: Mara has to tell her to be quiet more than anyone, and she is louder than she knows.
    example: During the first night alarm she whispered the whole Latin name of every antibiotic she could remember until Mara put a hand over her mouth.
  - tag: soft_touch
    manifests: Gives things away — food, time, her place in line — and apologizes while doing it.
    triggers: Anyone hungry, hurt, or younger than her.
    causes: She arrives at the end of the day with less than everyone else, and pushes Ray to be kinder than the numbers allow.
    costs: She is hungrier and weaker every week, and Ray thinks of her as a liability in any argument about the door.
    example: Has been giving Eli a third of her dinner every night since the second week.
contradictions:
  - belief_a: You help people. That is the whole job.
    belief_b: Opening the door for the wrong person kills everyone inside.
    a_wins_when: Someone is hurt in front of her and she can reach them.
    b_wins_when: It is dark, or she cannot see the stranger's hands and arms.
decision_stack:
  layers:
    - Help whoever is hurt closest to her
    - Keep Eli and Mara safe
    - Keep the crew's count honest
    - Keep herself safe
  inversion_conditions:
    - When the danger is loud and close — a gunshot, a scream in the building — her own safety jumps to the top and she freezes or hides.
  past_example: When Nita came back from a run with a gashed forearm, June cleaned and closed it on the sales floor while Ray was still yelling about the noise Nita had made.
silence:
  goes_quiet_when:
    - Someone mentions insulin or diabetes.
    - A gun is drawn in the room.
    - Ray says no to her in front of everyone.
  body_when_silent: Hands folded tight in her lap or wrapped around a can, head tilted to see past the crack in her glasses.
  refuses_to_discuss: ["The insulin line on the first day"]
  comfortable_vs_uncomfortable: Comfortable silence almost never happens to her; uncomfortable silence is when she has stopped counting and is just listening.
knowledge:
  knows:
    - Which of the crew's pills are expired and which still work.
    - A bite wound can close clean and still kill you.
    - How much food is on the shelves to within a few cans.
  does_not_know:
    - Who has been taking extra from the count.
  knows_but_hides:
    - She is giving Eli part of her dinner every night.
    - She ran from the insulin line on the first day.
  cues: [knows_bite_is_fatal, knows_no_sharing, knows_noise_draws_dead]
voice:
  capsule: Warm, quick and a little too loud; strings clauses together with 'and' and 'like'. Pharmacy politeness — 'hon', 'okay, so' — survives. When frightened she either chatters or goes dead quiet, and her voice cracks upward.
  speech_tendencies:
    - Starts sentences with "Okay, so".
    - Uses exact numbers from her counts.
    - Says "hon" to anyone younger or hurt.
  exemplars:
    low_stakes: "Okay, so, forty-one cans of beans, and I swear there were forty-six on Tuesday, and I'm not saying anything, I'm just saying the number."
    under_pressure: "What was that? Mara? Was that the back? I'm — okay. Okay. I'm by the door."
    at_the_limit: "Don't. Don't, please, he's bleeding, just let me get to him, you can point that at me the whole time."
  would_never_say:
    - "Not my problem."
    - "Leave him."
    - "I'll shoot, I swear to God."
  profanity: rare
  dialect_notes: Indianapolis flat vowels; her mother's Nigerian English comes out in 'abeg' and 'ehn' when she is very tired.
temper:
  fuse: 4
  outlet: words
  grudge: 1
  pet_peeves: ["anyone hoarding medicine", "being called sweetheart", "anyone mocking Eli"]
  cools_down_by: "sorting pill bottles by date"
