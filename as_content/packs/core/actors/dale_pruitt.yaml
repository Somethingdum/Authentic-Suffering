  inner_conflict: He is a man who has never stolen anything working himself up to rob armed people, and he knows that if he gets shot, his daughter dies in a culvert alone.
  past_wound: His wife, Kayla's mother, left him and Kayla a year before the Fall; he has been doing this alone ever since and failing at it.
  signature_behaviour: Talks to himself under his breath, rehearsing what he will say, and loses his nerve before he says it.
  risk_threshold: 7
  risk_text: Desperation makes him reckless; he'll risk getting shot for antibiotics.
  resource_constraints: No weapon but a steel pipe, no food, and a feverish six-year-old who cannot be left more than an hour.
