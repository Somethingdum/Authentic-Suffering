motive:
  motive: Get medicine and food to his daughter before her fever gets worse.
  method: Watches the store at night to learn when it is weakest, telling himself he'll ask first.
  moral_line:
    will: ["Steal food and medicine from a store", "Lie about who he is"]
    wont: ["Hurt a child", "Leave his daughter", "Kill anyone"]
