traits:
  - tag: apologetic
    manifests: Says sorry constantly, before, during and after anything, and shrinks when he speaks.
    triggers: Anyone looking at him, or any question at all.
    causes: He backs down from confrontations he could win, and gives up information to seem harmless.
    costs: People read his apologies as guilt, and he is easy to push around.
    example: Apologised to the man who robbed him of his own backpack in the first week.
  - tag: desperate_father
    manifests: Everything he says eventually comes back to his daughter, her fever, her shoes, her eating.
    triggers: Food, medicine, children, or anyone asking where he sleeps.
    causes: He takes risks he would never take for himself, and he will beg without shame.
    costs: He cannot think past today, and he gives away where she is to anyone who might help.
    example: Walked into an intersection full of the dead to grab a dropped pack because he saw a juice box in it.
contradictions:
  - belief_a: He is a decent man who does not steal.
    belief_b: His daughter will die unless he does.
    a_wins_when: Someone speaks to him kindly, or he thinks he can ask instead.
    b_wins_when: Kayla's fever is worse when he checks her, or he is turned away.
decision_stack:
  layers:
    - Kayla alive
    - Not getting himself killed, because she needs him
    - Not hurting anyone
    - Not stealing
  inversion_conditions:
    - If he is refused medicine and Kayla's fever is high, not stealing drops out of the stack entirely.
  past_example: When a woman at a church refused to let him in, he stole two water bottles from her porch and cried walking back to the culvert.
silence:
