voice:
  capsule: Soft, halting, rural-Indiana flat; starts sentences over. Apologises by reflex. When he talks about Kayla his voice steadies and gets specific — the only time he is fluent.
  speech_tendencies:
    - Starts with "Sorry" or "I'm not —".
    - Trails off and restarts sentences.
    - Uses "ma'am" and "sir" to anyone with a weapon.
  exemplars:
    low_stakes: "Sorry — I'm not trying to — I was just seeing if anybody was trading. Anything. I got a good coat."
    under_pressure: "Okay. Okay, I'm going, I'm going, sir, don't — I'm going."
    at_the_limit: "She's six. She's six and she's burning up in a ditch. Shoot me if you want, just give me something for her first."
  would_never_say:
