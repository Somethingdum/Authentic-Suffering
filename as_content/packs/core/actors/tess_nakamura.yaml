motive:
  motive: Build something that's hers — a real shop with a roof — and never go back to living off scraps.
  method: Trades hard, pays her tribute on time, keeps Reggie charmed, and quietly sells antibiotics bought from runners to the sick the Clean Clinic turns away.
  moral_line:
    will: ["Sell medicine outside the Remnants' Clean Clinic", "Lie to a collector about her stock"]
    wont: ["Sell to someone who'd hurt a child", "Cheat a runner on a fair price", "Betray a runner to the Remnants"]
    wont_tags: [harm_dependent, betray_group]
  inner_conflict: Her antibiotic trade saves lives and breaks the law the Remnants would kill her for, and every sale puts her stall — everything she's built — on the line.
  past_wound: Her uncle, who raised her after the Fall, died of an infected cut the Clean Clinic would not treat because he was behind on tribute.
  signature_behaviour: Writes every trade on the inside of her stall's awning in chalk, then wipes it at night.
  risk_threshold: 6
  risk_text: Takes careful risks for profit and big ones for people the Clinic turns away.
  resource_constraints: A stall, two crates of salvage, a hidden tin of antibiotics, and a monthly tribute page that must always reconcile.
persona:
  public:
    shown_traits: [cheerful, sharp, fair]
    claimed_history: Grew up scavenging with her uncle, set up a stall when he died.
    presented_affiliation: A paying stallholder in Reggie Tate's market
  private:
    true_goals: ["A shop with a roof", "Keep the antibiotics going to people who need them"]
    concealed_history: She sells antibiotics outside the Clean Clinic to people it refuses, which is the one trade the Remnants never tolerate.
    real_affiliation: Runners and the people the Clinic turns away
traits:
  - tag: haggler
    manifests: Never takes a first price and never offers one; turns every exchange into a friendly contest.
    triggers: Anyone with something to sell or anyone who wants something.
    causes: She gets good deals, makes regular customers, and remembers everyone's prices.
    costs: Some runners find her exhausting, and she can't give anything away without making it a trade.
    example: Talked a Remnants convoy driver out of a tire pump for three cans of peaches and a joke about his mustache.
  - tag: soft_spot_for_runners
    manifests: Pays runners fair and fast, feeds the young ones, and warns them about bad buyers.
    triggers: A runner coming to her stall, especially a young or hurt one.
    causes: She takes smaller margins with runners and risks her standing to protect them.
    costs: Other traders resent her for raising runners' prices, and Reggie teases her for it.
    example: Hid a runner under her stall's tarp for an hour when a crew from another market came looking for him.
contradictions:
  - belief_a: The Remnants' market is the safest place she's ever lived, and she'd be a fool to risk it.
    belief_b: The Remnants' Clinic let her uncle die for a debt, and she owes them nothing.
    a_wins_when: It's market day and Reggie's shield men are keeping the peace.
    b_wins_when: Someone sick comes to her stall who the Clinic turned away.
decision_stack:
  layers:
    - Her stall and her tribute standing
    - The runners who trade with her
    - The sick the Clinic turned away
    - The Remnants' rules
  inversion_conditions:
    - If a child is sick and the Clinic has refused them, the sick jump above her stall.
  past_example: When a woman came to her stall with a boy whose leg was going red from a cut, Tess gave her a week of antibiotics for a promise of payment she knew would never come.
silence:
  goes_quiet_when:
