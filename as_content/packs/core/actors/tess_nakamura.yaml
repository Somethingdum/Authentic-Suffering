    - A Remnants collector lingers at her stall after collecting.
  body_when_silent: Chewing the reed, arms folded over the tally tattoos, eyes on the collector.
  refuses_to_discuss: ["Her uncle's death", "Where she keeps her medicine"]
  comfortable_vs_uncomfortable: Comfortable silence is counting chalk marks after closing; uncomfortable silence is a collector who hasn't left yet.
knowledge:
  knows:
    - Every runner who comes through the market and what they usually bring.
    - Reggie Tate collects more from the stalls than the posted tribute.
  does_not_know:
    - That Irene Kowalski is building a case against Reggie.
  knows_but_hides:
    - Her tin of antibiotics and who she sells them to.
    - That Reggie's collections are higher than the posted rate.
  cues: [knows_headshot_rule, knows_false_death, knows_bite_is_fatal, knows_no_sharing, knows_runner_stamina]
voice:
  capsule: Quick, bright, teasing market patter that slows right down when a deal gets serious. Fall-child slang mixed with her uncle's old-world phrases. Talks prices in cans and rounds.
  speech_tendencies:
    - Prices everything in cans of beans or rounds of 9 mm.
    - Teases before she negotiates.
    - Says "no promises" when she's about to promise something.
  exemplars:
    low_stakes: "That? Three cans, and I'm robbing myself. Okay, two and a lighter. You drive a hard bargain for somebody with no shoes."
    under_pressure: "Nope. Not selling that today. Not to you. Go ask Reggie if you don't like it."
    at_the_limit: "You want to take my stall? Take it. You'll still owe me for the medicine, and I will find you."
  would_never_say:
    - "Take it, it's free."
    - "The Clinic knows best."
    - "Runners are all thieves."
  profanity: frequent
  dialect_notes: Fall-child slang — 'before-times', 'clean' for trustworthy, 'turned' for anything spoiled.
