# Picking up, carrying, giving, searching, reloading, eating, drinking.
# Item target kinds for moral_tags_if_target: 'owned' = the actor BELIEVES the item belongs to
# another body, household or group than its own (an 'owner' belief; mind/affordance.py, AFF-11).
- schema: as.affordance.v1
  id: pick_up_item
  verb: manipulate
  label: "Pick up {target}"
  ui_label: "Pick up {target}"
  binds: item_reachable
  range: reach
  requires: {hands_free: 1}
  moral_tags_if_target: {owned: [steal]}
  duration: {base_s: 1.5, per_meter_s: 0.71}
  noise_db: 20
  effect: pick_up
  paces: [careful, rushed]
  tags: [item]
- schema: as.affordance.v1
  id: drop_item
  verb: manipulate
  label: "Drop {item}"
  ui_label: "Drop the {item}"
  binds: item_held
  range: self
  duration: {base_s: 1}
  noise_db: 25
  effect: drop_item
  paces: [careful, rushed]
  tags: [item, comply_under_threat]
- schema: as.affordance.v1
  id: give_item
  verb: manipulate
  label: "Hand {item} to {target}"
  ui_label: "Give the {item} to {target}"
  binds: item_held
  range: touch
  duration: {base_s: 2}
  noise_db: 20
  effect: give_item
  paces: [careful, rushed]
  tags: [item, give, comply_under_threat]
- schema: as.affordance.v1
  id: take_from_container
  verb: manipulate
  label: "Take {item} out of {target}"
  ui_label: "Take the {item} from {target}"
  binds: container
  range: reach
  requires: {hands_free: 1}
  moral_tags_if_target: {owned: [steal]}
  duration: {base_s: 2, per_meter_s: 0.71}
  noise_db: 25
  effect: take_from
  paces: [careful, rushed]
  tags: [item]
- schema: as.affordance.v1
  id: put_into_container
  verb: manipulate
  label: "Put {item} into {target}"
  ui_label: "Put the {item} in {target}"
  binds: container
  range: reach
  duration: {base_s: 2, per_meter_s: 0.71}
  noise_db: 25
  effect: put_into
  paces: [careful, rushed]
  tags: [item]
- schema: as.affordance.v1
  id: search_container
  verb: search
  label: "Search {target} (about {duration})"
  ui_label: "Search {target}"
  binds: container
  range: reach
  requires: {hands_free: 1}
  moral_tags_if_target: {owned: [steal]}
  duration: {base_s: 20, per_meter_s: 0.71}
  noise_db: 40
  effect: search_container
  paces: [careful, rushed]
  tags: [search]
- schema: as.affordance.v1
  id: search_place
  verb: search
  label: "Search this place carefully (about {duration})"
  ui_label: "Search the place"
  binds: none
  range: same_place
  requires: {mobile: true, hands_free: 1}
  duration: {base_s: 120}
  noise_db: 40
  effect: search_place
  paces: [careful, rushed]
  tags: [search]
- schema: as.affordance.v1
  id: equip_item
  verb: manipulate
  label: "Take {item} into your hand"
  ui_label: "Get the {item} out"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 2}
  noise_db: 20
  effect: equip
  paces: [rushed]
  tags: [item, ready_weapon]
- schema: as.affordance.v1
  id: holster_item
  verb: manipulate
  label: "Put {item} away"
  ui_label: "Put the {item} away"
  binds: item_held
  range: self
  duration: {base_s: 2}
  noise_db: 15
  effect: holster
  paces: [rushed]
  tags: [item]
- schema: as.affordance.v1
  id: reload_firearm
  verb: manipulate
  label: "Reload {item} (about {duration})"
  ui_label: "Reload the {item}"
  binds: item_held
  range: self
  requires: {hands_free: 1, held_item_tags: [firearm], carried_item_tags: [magazine]}
  duration: {base_s: 4}
  noise_db: 45
  effect: reload
  paces: [rushed]
  tags: [item, reload]
- schema: as.affordance.v1
  id: throw_distraction
  verb: manipulate
  label: "Throw {item} toward {destination} to make a noise there"
  ui_label: "Throw the {item} for a distraction"
  binds: item_held
  range: visible
  duration: {base_s: 1.5}
  noise_db: 20
  effect: throw_distraction
  tags: [item, distraction]
- schema: as.affordance.v1
  id: eat_food
  verb: manipulate
  label: "Eat {item} (about {duration})"
  ui_label: "Eat the {item}"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 300}
  noise_db: 20
  effect: eat
  tags: [consume, food]
- schema: as.affordance.v1
  id: drink_water
  verb: manipulate
  label: "Drink from {item}"
  ui_label: "Drink from the {item}"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 30}
  noise_db: 20
  effect: drink
  tags: [consume, water]
# I1 (D-85): meat from a carcass. What the dead fed on carries it into the meat (action.effects butcher).
- schema: as.affordance.v1
  id: butcher_carcass
  verb: manipulate
  label: "Butcher {target} for meat (about {duration})"
  ui_label: "Butcher the {target}"
  binds: body
  range: touch
  requires: {hands_free: 1, held_item_tags: [blade], target_kinds: [animal], target_alive: false}
  duration: {base_s: 900}
  noise_db: 30
  effect: butcher
  tags: [food, work]
# W1 (D-77): the wet strain's compulsion — never on a menu (reflex_only); turn.cognition builds them.
- schema: as.affordance.v1
  id: spit_into
  verb: manipulate
  label: "Spit into {item}"
  ui_label: "Spit into the {item}"
  binds: none
  range: self
  requires: {reflex_only: true}
  duration: {base_s: 2}
  noise_db: 10
  effect: spit
  tags: [compulsion]
- schema: as.affordance.v1
  id: spit_in_mouth
  verb: manipulate
  label: "Spit into {target}'s mouth"
  ui_label: "Spit into {target}'s mouth"
  binds: body
  range: touch
  requires: {reflex_only: true, target_kinds: [human]}
  duration: {base_s: 3}
  noise_db: 5
  effect: spit
  tags: [compulsion]

# F1c (D-86): washing, the dead's gore, and clothes. The water a wash takes is water nobody drinks.
- schema: as.affordance.v1
  id: wash_self
  verb: manipulate
  label: "Wash yourself with {item} (about {duration})"
  ui_label: "Wash with the {item}"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 300}
  noise_db: 30
  effect: wash
  tags: [care, water]
- schema: as.affordance.v1
  id: smear_gore
  verb: manipulate
  label: "Smear yourself with the gore of {target} (about {duration})"
  ui_label: "Smear yourself with the {target}'s gore"
  binds: body
  range: touch
  requires: {hands_free: 1, target_kinds: [infected], target_alive: false}
  duration: {base_s: 120}
  noise_db: 25
  effect: smear
  tags: [care, disguise]
- schema: as.affordance.v1
  id: take_off_clothing
  verb: manipulate
  label: "Take off {item}"
  ui_label: "Take off the {item}"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 20}
  noise_db: 15
  effect: take_off
  tags: [clothing, undress]
- schema: as.affordance.v1
  id: change_into
  verb: manipulate
  label: "Change into {item} (about {duration})"
  ui_label: "Put on the {item}"
  binds: item_carried
  range: self
  requires: {hands_free: 1}
  duration: {base_s: 60}
  noise_db: 15
  effect: change_into
  tags: [clothing]
- schema: as.affordance.v1
  id: strip_clothing
  verb: manipulate
  label: "Take {item} off {target} (about {duration})"
  ui_label: "Take the {item} off {target}"
  binds: body
  range: touch
  requires: {hands_free: 1, target_kinds: [human], target_alive: false}
  duration: {base_s: 60}
  noise_db: 15
  effect: strip
  tags: [clothing, undress, loot]
