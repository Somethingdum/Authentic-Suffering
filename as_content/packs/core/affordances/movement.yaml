# Movement and position. Speeds: walk 1.4 m/s (0.71 s/m), careful 1.0, sneak 0.7 (1.43 s/m),
# run 3.5 (0.29 s/m) — docs/as/07_RULES.md §2.
- schema: as.affordance.v1
  id: move_to_anchor
  verb: move
  label: "Walk to {destination} ({distance}, about {duration})"
  ui_label: "Go to {destination}"
  binds: anchor
  range: same_place
  requires: {mobile: true}
  duration: {base_s: 0.5, per_meter_s: 0.71}
  noise_db: 30
  effect: move_to_anchor
  tags: [move]
- schema: as.affordance.v1
  id: go_look
  verb: move
  label: "Go and look toward {destination} ({distance}, about {duration})"
  ui_label: "Go and look at {destination}"
  binds: anchor
  range: same_place
  requires: {mobile: true, fear_exposure: true}
  duration: {base_s: 1, per_meter_s: 1.0}
  noise_db: 25
  effect: move_to_anchor
  tags: [move, investigate, careful]
- schema: as.affordance.v1
  id: sneak_to_anchor
  verb: move
  label: "Creep quietly to {destination} ({distance}, about {duration})"
  ui_label: "Sneak to {destination}"
  binds: anchor
  range: same_place
  requires: {mobile: true}
  duration: {base_s: 1, per_meter_s: 1.43}
  noise_db: 15
  check: {attribute: A, skill: stealth, tags: [quiet_mover], resistance: observer.best_perception, consequence_ladder: stealth6}
  effect: move_to_anchor
  tags: [move, sneak]
- schema: as.affordance.v1
