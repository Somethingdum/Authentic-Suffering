# Doors, windows, gates, locks and barricades. Portal facts are orthogonal (GEO-01).
- schema: as.affordance.v1
  id: open_portal
  verb: manipulate
  label: "Open {target}"
  ui_label: "Open {target}"
  binds: portal
  range: reach
  requires: {hands_free: 1, portal_kinds: [door, window, gate, vent, drain, curtain]}
