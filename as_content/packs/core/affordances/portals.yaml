- schema: as.affordance.v1
  id: pick_lock
  verb: manipulate
  label: "Pick the lock on {target} (slow, needs quiet hands)"
  ui_label: "Pick the lock on {target}"
  binds: portal
  range: reach
  requires: {hands_free: 2, carried_item_tags: [lockpick], skill: {domain: mechanics, min_rank: 1}, skill_or_belief_cue: knows_lock_picking, portal_kinds: [door, window, gate]}
  duration: {base_s: 45, per_meter_s: 0.71}
  noise_db: 20
  check: {attribute: A, skill: mechanics, tags: [locksmith], resistance: portal.lock_quality}
  effect: unlock_portal
  tags: [portal, lock, lockpick]
