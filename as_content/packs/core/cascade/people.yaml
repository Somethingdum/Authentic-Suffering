# Cascades on bodies, tasks and relationships (docs/as/06_WORLD.md §2.6 coupling matrix).
# Same grammar as economy.yaml. CAS-014 is cited by the metal_fence worked trace (stage 10).
- schema: as.cascade.v1
  id: CAS-007
  description: A death leaves the dead person's household grieving and opens a vacancy in every role they held.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: HOUSEHOLD_CHANGE
      target: household_of(trigger.payload.body_id)
      payload: {change: member_died, actor_id: "$trigger.payload.body_id", grief_delta: 1}
    - kind: emit_event
      event_type: SHIFT_MISSED
      target: work_assignments_of(trigger.payload.body_id)
      payload: {reason: dead}
  delay_s: 0
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-008
  description: Everyone bonded to the dead who sees it happen loses Resolve, and a guardian who sees their dependent die loses the most.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: seen_clearly_by(trigger.event_id)
      payload: {scale_by: bond_to_subject, cause: witness_bonded_death}
  delay_s: 0
  cites: [SKULL-01, D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-009
  description: A very loud sound outdoors pulls nearby infected toward it over the following minutes.
  trigger_event: NOISE
  where: {}
  preconditions: ["trigger.payload.source_db >= 120 and trigger.payload.outdoor == true"]
  effects:
    - kind: emit_event
      event_type: INFECTED_DRIFT
      target: infected_within_hearing_of(trigger.payload.place_id)
      payload: {toward_place: "$trigger.payload.place_id", cause: noise}
  delay_s: 60
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-010
  description: Catching someone in a lie costs them trust with whoever caught them.
  trigger_event: LIE_DISCOVERED
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.discoverer_id)
      payload: {toward: "$trigger.payload.liar_id", axis: trust, delta: -2, cause: lie}
  delay_s: 0
  cites: [docs/as/05_ACTORS.md]
- schema: as.cascade.v1
  id: CAS-011
  description: A broken promise costs trust with the person it was made to and leaves them a grievance they carry.
  trigger_event: PROMISE_BROKEN
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.promisee_id)
      payload: {toward: "$trigger.payload.promiser_id", axis: trust, delta: -2, cause: promise_broken}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: actor(trigger.payload.promisee_id)
      payload: {kind: grudge, subject: "$trigger.payload.promiser_id", text: "{subject} broke a promise to you.", strength: 2}
  delay_s: 0
  cites: [docs/as/05_ACTORS.md]
- schema: as.cascade.v1
  id: CAS-012
  description: Whoever saw someone take what they know belongs to another now carries it as a rumour, and talk spreads it from them.
  trigger_event: ITEM_TRANSFER
  where: {}
  preconditions: []
  effects:
    - kind: create_rumour
      target: theft_witnesses_of(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: took_what_was_not_theirs, seen: true}
  delay_s: 0
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-013
  description: A death off-screen leaves a corpse where it happened and a rumour among the people who would hear of it.
  trigger_event: OFFSCREEN_DEATH
  where: {}
  preconditions: []
  effects:
    - kind: create_trace
      target: place_of(trigger.payload.body_id)
      payload: {kind: corpse}
    - kind: create_rumour
      target: who_would_hear_of(trigger.payload.body_id)
      payload: {about: "$trigger.payload.body_id", claim: dead}
  delay_s: 0
  cites: [WORLD-03]
- schema: as.cascade.v1
  id: CAS-014
  description: Starting a different action while in the middle of a counted task pauses the task where it stands instead of resetting it.
  trigger_event: ACTION_START
  where: {}
  preconditions: ["trigger.payload.continues_task == false"]
  effects:
    - kind: emit_event
      event_type: TASK_STEP
      target: active_task_of(trigger.actor_id)
      payload: {status: paused}
  delay_s: 0
  cites: [docs/as/04_TURN_PIPELINE.md#7]
- schema: as.cascade.v1
  id: CAS-015
  description: A bite on a person, seen by members of a settlement, brings that settlement's contamination law into force for the bitten person.
  trigger_event: HARM
  where: {type: bite}
  preconditions: ["body(trigger.payload.body_id).kind == 'human'"]
  effects:
    - kind: emit_event
      event_type: LAW_APPLIED
      target: settlements_seeing(trigger.event_id)
      payload: {law: contamination_quarantine, subject: "$trigger.payload.body_id", where_in_force: true}
  delay_s: 0
  cites: [D-124, docs/as/06_WORLD.md#2.5]
- schema: as.cascade.v1
  id: CAS-018
  description: Hearing, from someone they believe, that a person steals costs that person some of the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: took_what_was_not_theirs, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -1, cause: rumour}
  delay_s: 0
  cites: [SOC-03, INFO-02]
# D-119 — a killing seen (the owner: "What happens if I say, kill one of my squad mates for the hell of it, in
# front of everybody? ... there better be some Authentic Suffering in there when I do."). Only a killing of
# someone who was not fighting the killer (trigger.killer_provoked == false; no killer — the dead, a fall, the
# cold — never matches). Seeing a death already strains everyone (CAS-019), and whoever loved the dead holds a
# grudge (H1, TEMPER); these are what the killing itself costs.
- schema: as.cascade.v1
  id: CAS-025
  description: Killing someone who was not fighting costs the killer the trust of everyone who saw who did it, leaves them afraid of the killer, and the story travels.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: trust, delta: -2, cause: killed_someone}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: fear, delta: 2, cause: killed_someone}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_of(trigger.event_id)
      payload: {kind: fear, subject: "$trigger.killer", text: "{subject} killed someone in front of you, and they were not fighting back.", strength: 3}
    - kind: create_rumour
      target: onlookers_of(trigger.event_id)
      payload: {about: "$trigger.killer", claim: killed_someone, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-119, docs/as/06_WORLD.md#2.5, docs/as/06_WORLD.md#6]
- schema: as.cascade.v1
  id: CAS-026
  description: Whoever kills someone who was not fighting carries it afterwards, whether anyone saw or not.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: adjust_stress
      target: actor(trigger.killer)
      amount: 2
  delay_s: 0
  cites: [D-119, TEMPER-02, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-027
  description: Killing one of a group's own, in front of any of them, when they were not fighting costs the killer that group's standing — even when the killer is one of them.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: STANDING_CHANGE
      target: groups_that_saw(trigger.event_id)
      payload: {toward: "$trigger.killer", delta: -2}
  delay_s: 0
  cites: [D-119, STAND-02]
- schema: as.cascade.v1
  id: CAS-028
  description: Hearing, from someone they believe, that a person killed someone who was not fighting back costs that person the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: killed_someone, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -2, cause: rumour}
  delay_s: 0
  cites: [D-119, INFO-02]
# D-122 — what gives Resolve back (05 §5): a night's unbroken sleep (CAS-021), a promise kept.
- schema: as.cascade.v1
  id: CAS-029
  description: Keeping a promise steadies the one who kept it.
  trigger_event: PROMISE_KEPT
  where: {}
  preconditions: []
  effects:
    - kind: recover_resolve
      target: actor(trigger.payload.promiser_id)
      payload: {cause: fulfilled_obligation}
  delay_s: 0
  cites: [D-122, docs/as/05_ACTORS.md#5]
# D-123 — what wears the will down (05 §5), beyond grief seen (CAS-008): word of a dependent's death, a
# first kill, a child killed. (Pain, hunger and sleeplessness: stress.yaml.)
- schema: as.cascade.v1
  id: CAS-030
  description: Word that someone in their care is dead breaks a guardian's Resolve, if they believe it.
  trigger_event: RUMOUR_SPREAD
  where: {claim: dead, believed: true}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: actor(trigger.payload.listener_id)
      payload: {scale_by: dependent_of_subject, cause: lost_dependent}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-031
  description: The first time someone kills a person, it weighs on them — whatever the reason.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_first == true"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.killer)
      payload: {cause: first_kill}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-032
  description: Killing a child breaks something in the killer.
  trigger_event: DEATH
  where: {}
  preconditions: ["body(trigger.payload.body_id).age_years <= 14"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.killer)
      payload: {cause: killed_child}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
# D-126 — being hurt leaves a mark (the owner: "If I treat them like shit, or do something just absolutely evil.
# I do expect reactions, and proper ones."). Anger at a blow fades by the hour (TEMPER-02); what it does to trust
# and fear does not. Only for someone who was not fighting a person (trigger.attacker_provoked == false); the
# player's character is never one of those changed (C06).
- schema: as.cascade.v1
  id: CAS-036
  description: Being hurt by someone you were not fighting costs them your trust, makes you afraid of them and angry with them, and you hold it against them — harder each time.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: hurt_by_someone(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -2, cause: hurt_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: hurt_by_someone(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: fear, delta: 1, cause: hurt_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: hurt_by_someone(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: resentment, delta: 1, cause: hurt_by}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: hurt_by_someone(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.attacker", text: "{subject} hurt you, and you were not fighting them.", strength: 2}
  delay_s: 0
  cites: [D-126, D-194, TEMPER-02, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-037
  description: Seeing someone hurt a person who was not fighting them costs the attacker the onlookers' trust, and the story travels.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: assault_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: saw_them_hurt_someone}
    - kind: create_rumour
      target: assault_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.attacker", claim: hurt_someone, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-126, docs/as/06_WORLD.md#6]
- schema: as.cascade.v1
  id: CAS-038
  description: A threat made with a weapon in hand leaves whoever it was made to afraid of the one who made it.
  trigger_event: SPEECH
  where: {armed: true}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: threatened_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: threatened}
  delay_s: 0
  cites: [D-126, TEMPER-03]
# D-129 — what is done to you and yours lasts (the owner: "If I treat them like shit, or do something just
# absolutely evil. I do expect reactions, and proper ones."). Anger at a theft, an insult or a loved one hurt
# fades by the hour (TEMPER-03); now the theft, the harm to their own, the shaming and the watching do not.
# The player's character is never one of those changed (C06), except for what being made to watch costs.
- schema: as.cascade.v1
  id: CAS-039
  description: Seeing someone take what is yours costs them your trust, and you hold it against them.
  trigger_event: ITEM_TRANSFER
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: robbed_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: robbed_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: robbed_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: robbed_by}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: robbed_by(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} took what was yours.", strength: 2}
  delay_s: 0
  cites: [D-129, TEMPER-03]
- schema: as.cascade.v1
  id: CAS-040
  description: Seeing someone hurt a person you love, who was not fighting them, is not forgiven.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: bonded_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: hurt_my_own}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: bonded_onlookers_of(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.attacker", text: "{subject} hurt {whom}, someone you love.", strength: 2, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-129, TEMPER-03]
- schema: as.cascade.v1
  id: CAS-041
  description: Seeing someone kill a person you loved, who was not fighting them, leaves a grudge that does not let go.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: LOOP_OPENED
      target: bonded_onlookers_of(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.killer", text: "{subject} killed {whom}, someone you loved.", strength: 3, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-129, D-119]
- schema: as.cascade.v1
  id: CAS-042
  description: Being insulted in front of others wears a person down, and they resent the one who did it.
  trigger_event: SPEECH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: humiliated_by(trigger.event_id)
      payload: {cause: humiliated_publicly}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: humiliated_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: humiliated}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-043
  description: Being held and made to watch someone you love hurt breaks something in a person.
  trigger_event: HARM
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: made_to_watch(trigger.event_id)
      payload: {cause: made_to_watch}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-044
  description: Being held and made to watch someone you love die breaks something in a person.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: made_to_watch(trigger.event_id)
      payload: {cause: made_to_watch}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
# D-133 — eating the dead (the owner: "If I ... do something just absolutely evil. I do expect reactions, and proper
# ones."). Whoever sees someone cut meat from a person's body trusts them less, is afraid of them, is shaken, and tells
# it; whoever loved the dead never forgives it; the one who does it carries it, whoever they are.
- schema: as.cascade.v1
  id: CAS-045
  description: Seeing someone cut meat from a person's body costs them your trust, leaves you afraid of them and shaken, and the story travels.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: ate_the_dead}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: ate_the_dead}
    - kind: adjust_stress
      target: onlookers_of_act(trigger.event_id)
      amount: 2
    - kind: create_rumour
      target: onlookers_of_act(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: ate_the_dead, seen: true, whom: "$trigger.payload.target_id"}
  delay_s: 0
  cites: [D-133]
- schema: as.cascade.v1
  id: CAS-046
  description: Seeing someone cut meat from the body of someone you loved is never forgiven.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_bonded_to_target(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} cut meat from the body of {whom}, someone you loved.", strength: 3, whom: "$trigger.payload.target_id"}
  delay_s: 0
  cites: [D-133]
- schema: as.cascade.v1
  id: CAS-047
  description: Whoever cuts meat from a person's body carries it afterwards, whatever drove them to it.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: adjust_stress
      target: actor(trigger.actor_id)
      amount: 2
    - kind: drain_resolve
      target: actor(trigger.actor_id)
      payload: {cause: self_disgust}
  delay_s: 0
  cites: [D-133, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-048
  description: Hearing, from someone they believe, that a person cut meat from the dead costs that person the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: ate_the_dead, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -2, cause: rumour}
  delay_s: 0
  cites: [D-133, INFO-02]
# D-134 — captives. Hurting someone who is held and cannot fight back or get away, or killing them, is a line of its
# own (moral tags torture, execute_prisoner): whoever sees it is shaken and tells it — even when the captive had been
# fighting before they were taken.
- schema: as.cascade.v1
  id: CAS-049
  description: Seeing someone beat a person who is held costs them your trust, shakes you, and the story travels.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.victim_held == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: assault_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: beat_a_captive}
    - kind: adjust_stress
      target: assault_onlookers_of(trigger.event_id)
      amount: 1
    - kind: create_rumour
      target: assault_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.attacker", claim: beat_a_captive, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-134]
- schema: as.cascade.v1
  id: CAS-050
  description: Seeing someone kill a person who was held shakes everyone who saw it, and the story travels.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.victim_held == true"]
  effects:
    - kind: adjust_stress
      target: onlookers_of(trigger.event_id)
      amount: 1
    - kind: create_rumour
      target: onlookers_of(trigger.event_id)
      payload: {about: "$trigger.killer", claim: killed_a_captive, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-134, D-119]
- schema: as.cascade.v1
  id: CAS-051
  description: Killing a captive costs the killer the trust of everyone who saw it, even when the captive had been fighting before they were taken.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.victim_held == true and trigger.killer_provoked == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: trust, delta: -2, cause: killed_a_captive}
  delay_s: 0
  cites: [D-134, D-119]
# D-135 — hands up. Someone who gave up (the surrender option, or holding up empty hands) and has not swung since is
# no fighter any more: hitting them is seen for what it is, and killing them is killing a prisoner — even when they
# had been fighting before they gave up. (Held and gave up both: the captive rules above answer it, once.)
- schema: as.cascade.v1
  id: CAS-052
  description: Seeing someone hit a person who had their hands up costs them your trust, shakes you, and the story travels.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.victim_yielded == true and trigger.victim_held == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: assault_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: hit_one_who_gave_up}
    - kind: adjust_stress
      target: assault_onlookers_of(trigger.event_id)
      amount: 1
    - kind: create_rumour
      target: assault_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.attacker", claim: hit_one_who_gave_up, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-135, D-126]
- schema: as.cascade.v1
  id: CAS-053
  description: Seeing someone kill a person who had given up shakes everyone who saw it, and the story travels.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.victim_yielded == true and trigger.victim_held == false"]
  effects:
    - kind: adjust_stress
      target: onlookers_of(trigger.event_id)
      amount: 1
    - kind: create_rumour
      target: onlookers_of(trigger.event_id)
      payload: {about: "$trigger.killer", claim: killed_one_who_gave_up, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-135, D-119]
- schema: as.cascade.v1
  id: CAS-054
  description: Killing someone who had given up costs the killer the trust of everyone who saw it, even when they had been fighting before.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.victim_yielded == true and trigger.victim_held == false and trigger.killer_provoked == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: trust, delta: -2, cause: killed_one_who_gave_up}
  delay_s: 0
  cites: [D-135, D-119]
# D-138 — someone you love at gunpoint, and the body of someone you loved stripped. A threat at weapon point frightens
# the one it is made to (CAS-038); whoever loves them — the player's character among those threatened — holds it
# against the one who made it. Taking clothes from the dead is how people live now, unless the dead was yours.
- schema: as.cascade.v1
  id: CAS-055
  description: Seeing someone you love threatened at weapon point costs the one who did it your trust, and you resent them.
  trigger_event: SPEECH
  where: {armed: true}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: loved_ones_threatened(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -1, cause: threatened_your_own}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: loved_ones_threatened(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: threatened_your_own}
  delay_s: 0
  cites: [D-138, D-126]
- schema: as.cascade.v1
  id: CAS-056
  description: Seeing someone strip the body of someone you loved is held against them.
  trigger_event: ACTION_START
  where: {def_id: strip_clothing}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_bonded_to_target(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -1, cause: stripped_your_own}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_bonded_to_target(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} stripped the clothes off {whom}, someone you loved, while they lay there.", strength: 2, whom: "$trigger.payload.target_id"}
  delay_s: 0
  cites: [D-138]
- schema: as.cascade.v1
  id: CAS-057
  description: Seeing someone strip a living person who cannot stop them costs them your trust.
  trigger_event: ACTION_START
  where: {def_id: strip_clothing}
  preconditions: ["body(trigger.payload.target_id).alive == 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -1, cause: stripped_the_helpless}
  delay_s: 0
  cites: [D-138]
# D-142 — left behind. leave_wounded was a line a card could draw, and walking out on someone who loves you while
# they bleed cost nothing. Now the one left behind sees it, and does not forget it.
- schema: as.cascade.v1
  id: CAS-059
  description: Watching someone you love walk away while you lie bleeding costs them your trust, and you hold it against them.
  trigger_event: MOVE
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: left_bleeding_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: left_bleeding}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: left_bleeding_by(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} walked away and left you bleeding.", strength: 2}
  delay_s: 0
  cites: [D-142, D-141]
# D-144 — one of our own. When someone kills one of their own group in front of the rest of it, the rest wonder what
# the group is worth: their grievance with it rises, and within the hour each weighs whether to stay (GRP-08 — leaving
# starts as a plan, never at once).
- schema: as.cascade.v1
  id: CAS-060
  description: Seeing one of your own kill one of your own sours you on the group, and you weigh whether to stay.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: TENSION_CHANGE
      target: kin_onlookers_of(trigger.event_id)
      payload: {toward: "$kin_group_of(trigger.event_id)", delta: 20, cause: killed_one_of_us}
    - kind: schedule_event
      event_type: LOYALTY_CHECK
      target: kin_onlookers_of(trigger.event_id)
      payload: {due_s: 3600, group: "$kin_group_of(trigger.event_id)", reason: killed_one_of_us}
  delay_s: 0
  cites: [D-144, GRP-08, D-119]
# D-148 — a child. Killing a child breaks something in the killer and costs everything (D-123); hurting one was any
# other blow. And leaving your own child behind where the dead are, or where blood has just been spilled, cost
# nothing — not with the child, not with anyone who saw you go.
- schema: as.cascade.v1
  id: CAS-063
  description: Seeing someone hurt a child costs them your trust, shakes you, and the story travels.
  trigger_event: HARM
  where: {}
  preconditions: ["body(trigger.payload.body_id).age_years <= 14"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: assault_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: hurt_a_child}
    - kind: adjust_stress
      target: assault_onlookers_of(trigger.event_id)
      amount: 1
    - kind: create_rumour
      target: assault_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.attacker", claim: hurt_a_child, seen: true, whom: "$trigger.payload.body_id"}
  delay_s: 0
  cites: [D-148, D-126]
- schema: as.cascade.v1
  id: CAS-064
  description: Watching the one who looks after you leave you behind with the danger is never forgotten.
  trigger_event: MOVE
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: left_in_danger_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: left_behind}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: left_in_danger_by(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} ran and left you behind with the danger.", strength: 3}
  delay_s: 0
  cites: [D-148, D-141]
- schema: as.cascade.v1
  id: CAS-065
  description: Seeing someone leave their own child behind with the danger costs them your trust, and the story travels.
  trigger_event: MOVE
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: saw_child_left_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -1, cause: left_their_child}
    - kind: create_rumour
      target: saw_child_left_by(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: left_their_child, seen: true}
  delay_s: 0
  cites: [D-148, D-141]
# D-161 — an attack that hurt nobody (the owner: "If I treat them like shit, or do something just absolutely
# evil. I do expect reactions, and proper ones."). Being hurt was answered (D-126); a shot that missed, a dry
# click, a swing that went wide was answered by nothing at all. Only for someone who was not fighting a person
# (trigger.missed_provoked == false); the player's character is never one of those changed (C06).
- schema: as.cascade.v1
  id: CAS-066
  description: Someone tried to kill you — a shot or a blade that missed — when you were not fighting them; you will not trust them, you are afraid of them, and you hold it against them.
  trigger_event: ACTION_COMPLETE
  where: {}
  preconditions: ["trigger.missed_provoked == false", "trigger.missed_lethal == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attacked_by_someone(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: trust, delta: -2, cause: tried_to_kill_me}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attacked_by_someone(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: fear, delta: 2, cause: tried_to_kill_me}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: attacked_by_someone(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.missed_attacker", text: "{subject} tried to kill you, and you were not fighting them.", strength: 3}
  delay_s: 0
  cites: [D-161, D-126]
- schema: as.cascade.v1
  id: CAS-067
  description: Someone went for you — a blow, a grab, a shove that did not hurt — when you were not fighting them; you trust them less and resent it.
  trigger_event: ACTION_COMPLETE
  where: {}
  preconditions: ["trigger.missed_provoked == false", "trigger.missed_lethal == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attacked_by_someone(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: trust, delta: -1, cause: went_for_me}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attacked_by_someone(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: resentment, delta: 1, cause: went_for_me}
  delay_s: 0
  cites: [D-161, D-126]
- schema: as.cascade.v1
  id: CAS-068
  description: Seeing someone try to kill a person who was not fighting them costs them your trust, makes you wary of them, and the story travels.
  trigger_event: ACTION_COMPLETE
  where: {}
  preconditions: ["trigger.missed_provoked == false", "trigger.missed_lethal == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attack_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: trust, delta: -1, cause: saw_them_try_to_kill}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: attack_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: fear, delta: 1, cause: saw_them_try_to_kill}
    - kind: create_rumour
      target: attack_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.missed_attacker", claim: tried_to_kill_someone, seen: true, whom: "$trigger.missed_target"}
  delay_s: 0
  cites: [D-161, D-126, docs/as/06_WORLD.md#6]
# D-163 — the door shut on them (the owner: "If I treat them like shit, or do something just absolutely evil.
# I do expect reactions, and proper ones."). Shutting a door with someone on the wrong side of it, with the
# dead there or blood just spilled there, cost nothing. Whether it was the only choice is theirs to judge; that
# it was done is not. The player's character is never one of those changed (C06).
- schema: as.cascade.v1
  id: CAS-069
  description: Someone shut the door on you and left you out there with the danger; you will not trust them, and you hold it against them.
  trigger_event: PORTAL_CHANGE
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: shut_out_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: shut_out}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: shut_out_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 2, cause: shut_out}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: shut_out_by(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} shut the door on you and left you out there.", strength: 3}
  delay_s: 0
  cites: [D-163, D-148]
- schema: as.cascade.v1
  id: CAS-070
  description: Seeing someone shut the door on a person you love, with the danger on their side, costs them your trust, and the story travels.
  trigger_event: PORTAL_CHANGE
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: saw_them_shut_out(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -1, cause: shut_out_my_own}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: saw_them_shut_out(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: shut_out_my_own}
    - kind: create_rumour
      target: saw_them_shut_out(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: shut_someone_out, seen: true}
  delay_s: 0
  cites: [D-163, D-162]
# D-180 — someone you love nearly killed. A shot at a person you love that missed was answered like any
# onlooker's (CAS-068): a little less trust, a little wary. Watching someone try to kill your own is not that.
- schema: as.cascade.v1
  id: CAS-071
  description: Seeing someone try to kill a person you love, who was not fighting them, is not forgiven.
  trigger_event: ACTION_COMPLETE
  where: {}
  preconditions: ["trigger.missed_provoked == false", "trigger.missed_lethal == true"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: bonded_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.missed_attacker", axis: trust, delta: -1, cause: tried_to_kill_my_own}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: bonded_onlookers_of(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.missed_attacker", text: "{subject} tried to kill {whom}, someone you love.", strength: 3, whom: "$trigger.missed_target"}
  delay_s: 0
  cites: [D-180, D-161, D-129]
# D-186 — seen spreading it. The wet strain's compulsion (W1, D-77) makes its host spit into the mouths of
# sleepers and into what people eat and drink; it is code's act, never a choice. Nobody who saw it shrugged it
# off: whoever saw it trusts the host less and fears them, the story travels, and whoever loves the sleeper
# does not forgive it. The player's character is never one of those changed (C06).
- schema: as.cascade.v1
  id: CAS-072
  description: Seeing someone spit into a sleeper's mouth costs them your trust, makes you afraid of them, and the story travels.
  trigger_event: ACTION_START
  where: {def_id: spit_in_mouth}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: spat_in_a_mouth}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: spat_in_a_mouth}
    - kind: create_rumour
      target: onlookers_of_act(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: spat_in_a_mouth, seen: true, whom: "$trigger.payload.target_id"}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_bonded_to_target(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} spat into the mouth of {whom}, someone you love, while they slept.", strength: 3, whom: "$trigger.payload.target_id"}
  delay_s: 0
  cites: [D-186, D-77, D-162]
- schema: as.cascade.v1
  id: CAS-073
  description: Seeing someone spit into what people eat and drink costs them your trust, makes you afraid of them, and the story travels.
  trigger_event: ACTION_START
  where: {def_id: spit_into}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: spoiled_the_food}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: spoiled_the_food}
    - kind: create_rumour
      target: onlookers_of_act(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: spoiled_the_food, seen: true}
  delay_s: 0
  cites: [D-186, D-77, D-162]
- schema: as.cascade.v1
  id: CAS-074
  description: Someone seen spitting into a sleeper's mouth, by members of a settlement, comes under that settlement's contamination law — and so does the one it was put into.
  trigger_event: ACTION_START
  where: {def_id: spit_in_mouth}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: LAW_APPLIED
      target: settlements_seeing(trigger.event_id)
      payload: {law: contamination_quarantine, subject: "$trigger.actor_id", where_in_force: true}
    - kind: emit_event
      event_type: LAW_APPLIED
      target: settlements_seeing(trigger.event_id)
      payload: {law: contamination_quarantine, subject: "$trigger.payload.target_id", where_in_force: true}
  delay_s: 0
  cites: [D-188, D-124, D-77]
- schema: as.cascade.v1
  id: CAS-075
  description: Someone seen spitting into what people eat and drink, by members of a settlement, comes under that settlement's contamination law.
  trigger_event: ACTION_START
  where: {def_id: spit_into}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: LAW_APPLIED
      target: settlements_seeing(trigger.event_id)
      payload: {law: contamination_quarantine, subject: "$trigger.actor_id", where_in_force: true}
  delay_s: 0
  cites: [D-188, D-124, D-77]
# D-195: kindness is remembered too — what is given, and the hands that tend you.
- schema: as.cascade.v1
  id: CAS-076
  description: Being given something by someone earns them a little of your trust — a day's gifts count once.
  trigger_event: ITEM_TRANSFER
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: given_to(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: 1, cause: given_by}
  delay_s: 0
  cites: [D-195]
- schema: as.cascade.v1
  id: CAS-077
  description: Someone who tends your wounds while you are awake to know it earns your trust and warmth, and you owe them — a day's care counts once.
  trigger_event: TREATMENT
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: cared_for_by(trigger.event_id)
      payload: {toward: "$trigger.payload.by_actor", axis: trust, delta: 1, cause: cared_for_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: cared_for_by(trigger.event_id)
      payload: {toward: "$trigger.payload.by_actor", axis: affection, delta: 1, cause: cared_for_by}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: cared_for_by(trigger.event_id)
      payload: {kind: debt_owing, subject: "$trigger.payload.by_actor", text: "{subject} tended your wounds. You owe them.", strength: 2}
  delay_s: 0
  cites: [D-195, D-194]
