# Cascades on bodies, tasks and relationships (docs/as/06_WORLD.md §2.6 coupling matrix).
# Same grammar as economy.yaml. CAS-014 is cited by the metal_fence worked trace (stage 10).
- schema: as.cascade.v1
  id: CAS-007
  description: A death leaves the dead person's household grieving and opens a vacancy in every role they held.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: HOUSEHOLD_CHANGE
      target: household_of(trigger.payload.body_id)
      payload: {change: member_died, actor_id: "$trigger.payload.body_id", grief_delta: 1}
    - kind: emit_event
      event_type: SHIFT_MISSED
      target: work_assignments_of(trigger.payload.body_id)
      payload: {reason: dead}
  delay_s: 0
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-008
  description: Everyone bonded to the dead who sees it happen loses Resolve, and a guardian who sees their dependent die loses the most.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: seen_clearly_by(trigger.event_id)
      payload: {scale_by: bond_to_subject, cause: witness_bonded_death}
  delay_s: 0
  cites: [SKULL-01, D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-009
  description: A very loud sound outdoors pulls nearby infected toward it over the following minutes.
  trigger_event: NOISE
  where: {}
  preconditions: ["trigger.payload.source_db >= 120 and trigger.payload.outdoor == true"]
  effects:
    - kind: emit_event
      event_type: INFECTED_DRIFT
      target: infected_within_hearing_of(trigger.payload.place_id)
      payload: {toward_place: "$trigger.payload.place_id", cause: noise}
  delay_s: 60
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-010
  description: Catching someone in a lie costs them trust with whoever caught them.
  trigger_event: LIE_DISCOVERED
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.discoverer_id)
      payload: {toward: "$trigger.payload.liar_id", axis: trust, delta: -2, cause: lie}
  delay_s: 0
  cites: [docs/as/05_ACTORS.md]
- schema: as.cascade.v1
  id: CAS-011
  description: A broken promise costs trust with the person it was made to and leaves them a grievance they carry.
  trigger_event: PROMISE_BROKEN
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.promisee_id)
      payload: {toward: "$trigger.payload.promiser_id", axis: trust, delta: -2, cause: promise_broken}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: actor(trigger.payload.promisee_id)
      payload: {kind: grudge, subject: "$trigger.payload.promiser_id", text: "{subject} broke a promise to you.", strength: 2}
  delay_s: 0
  cites: [docs/as/05_ACTORS.md]
- schema: as.cascade.v1
  id: CAS-012
  description: Whoever saw someone take what they know belongs to another now carries it as a rumour, and talk spreads it from them.
  trigger_event: ITEM_TRANSFER
  where: {}
  preconditions: []
  effects:
    - kind: create_rumour
      target: theft_witnesses_of(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: took_what_was_not_theirs}
  delay_s: 0
  cites: [docs/as/06_WORLD.md#2.6]
- schema: as.cascade.v1
  id: CAS-013
  description: A death off-screen leaves a corpse where it happened and a rumour among the people who would hear of it.
  trigger_event: OFFSCREEN_DEATH
  where: {}
  preconditions: []
  effects:
    - kind: create_trace
      target: place_of(trigger.payload.body_id)
      payload: {kind: corpse}
    - kind: create_rumour
      target: who_would_hear_of(trigger.payload.body_id)
      payload: {about: "$trigger.payload.body_id", claim: dead}
  delay_s: 0
  cites: [WORLD-03]
- schema: as.cascade.v1
  id: CAS-014
  description: Starting a different action while in the middle of a counted task pauses the task where it stands instead of resetting it.
  trigger_event: ACTION_START
  where: {}
  preconditions: ["trigger.payload.continues_task == false"]
  effects:
    - kind: emit_event
      event_type: TASK_STEP
      target: active_task_of(trigger.actor_id)
      payload: {status: paused}
  delay_s: 0
  cites: [docs/as/04_TURN_PIPELINE.md#7]
- schema: as.cascade.v1
  id: CAS-015
  description: A bite on a person, seen by members of a settlement, brings that settlement's contamination law into force for the bitten person.
  trigger_event: HARM
  where: {type: bite}
  preconditions: ["body(trigger.payload.body_id).kind == 'human'"]
  effects:
    - kind: emit_event
      event_type: LAW_APPLIED
      target: settlements_seeing(trigger.event_id)
      payload: {law: contamination_quarantine, subject: "$trigger.payload.body_id", where_in_force: true}
  delay_s: 0
  cites: [D-124, docs/as/06_WORLD.md#2.5]
- schema: as.cascade.v1
  id: CAS-018
  description: Hearing, from someone they believe, that a person steals costs that person some of the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: took_what_was_not_theirs, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -1, cause: rumour}
  delay_s: 0
  cites: [SOC-03, INFO-02]
# D-119 — a killing seen (the owner: "What happens if I say, kill one of my squad mates for the hell of it, in
# front of everybody? ... there better be some Authentic Suffering in there when I do."). Only a killing of
# someone who was not fighting the killer (trigger.killer_provoked == false; no killer — the dead, a fall, the
# cold — never matches). Seeing a death already strains everyone (CAS-019), and whoever loved the dead holds a
# grudge (H1, TEMPER); these are what the killing itself costs.
- schema: as.cascade.v1
  id: CAS-025
  description: Killing someone who was not fighting costs the killer the trust of everyone who saw who did it, leaves them afraid of the killer, and the story travels.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: trust, delta: -2, cause: killed_someone}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.killer", axis: fear, delta: 2, cause: killed_someone}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_of(trigger.event_id)
      payload: {kind: fear, subject: "$trigger.killer", text: "{subject} killed someone in front of you, and they were not fighting back.", strength: 3}
    - kind: create_rumour
      target: onlookers_of(trigger.event_id)
      payload: {about: "$trigger.killer", claim: killed_someone}
  delay_s: 0
  cites: [D-119, docs/as/06_WORLD.md#2.5, docs/as/06_WORLD.md#6]
- schema: as.cascade.v1
  id: CAS-026
  description: Whoever kills someone who was not fighting carries it afterwards, whether anyone saw or not.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: adjust_stress
      target: actor(trigger.killer)
      amount: 2
  delay_s: 0
  cites: [D-119, TEMPER-02, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-027
  description: Killing one of a group's own, in front of any of them, when they were not fighting costs the killer that group's standing — even when the killer is one of them.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: STANDING_CHANGE
      target: groups_that_saw(trigger.event_id)
      payload: {toward: "$trigger.killer", delta: -2}
  delay_s: 0
  cites: [D-119, STAND-02]
- schema: as.cascade.v1
  id: CAS-028
  description: Hearing, from someone they believe, that a person killed someone who was not fighting back costs that person the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: killed_someone, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -2, cause: rumour}
  delay_s: 0
  cites: [D-119, INFO-02]
# D-122 — what gives Resolve back (05 §5): a night's unbroken sleep (CAS-021), a promise kept.
- schema: as.cascade.v1
  id: CAS-029
  description: Keeping a promise steadies the one who kept it.
  trigger_event: PROMISE_KEPT
  where: {}
  preconditions: []
  effects:
    - kind: recover_resolve
      target: actor(trigger.payload.promiser_id)
      payload: {cause: fulfilled_obligation}
  delay_s: 0
  cites: [D-122, docs/as/05_ACTORS.md#5]
# D-123 — what wears the will down (05 §5), beyond grief seen (CAS-008): word of a dependent's death, a
# first kill, a child killed. (Pain, hunger and sleeplessness: stress.yaml.)
- schema: as.cascade.v1
  id: CAS-030
  description: Word that someone in their care is dead breaks a guardian's Resolve, if they believe it.
  trigger_event: RUMOUR_SPREAD
  where: {claim: dead, believed: true}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: actor(trigger.payload.listener_id)
      payload: {scale_by: dependent_of_subject, cause: lost_dependent}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-031
  description: The first time someone kills a person, it weighs on them — whatever the reason.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_first == true"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.killer)
      payload: {cause: first_kill}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-032
  description: Killing a child breaks something in the killer.
  trigger_event: DEATH
  where: {}
  preconditions: ["body(trigger.payload.body_id).age_years <= 14"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.killer)
      payload: {cause: killed_child}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
# D-126 — being hurt leaves a mark (the owner: "If I treat them like shit, or do something just absolutely evil.
# I do expect reactions, and proper ones."). Anger at a blow fades by the hour (TEMPER-02); what it does to trust
# and fear does not. Only for someone who was not fighting a person (trigger.attacker_provoked == false); the
# player's character is never one of those changed (C06).
- schema: as.cascade.v1
  id: CAS-036
  description: Being hurt by someone you were not fighting costs them your trust, makes you afraid of them, and you hold it against them.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: hurt_by_someone(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -2, cause: hurt_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: hurt_by_someone(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: fear, delta: 1, cause: hurt_by}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: hurt_by_someone(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.attacker", text: "{subject} hurt you, and you were not fighting them.", strength: 2}
  delay_s: 0
  cites: [D-126, TEMPER-02, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-037
  description: Seeing someone hurt a person who was not fighting them costs the attacker the onlookers' trust, and the story travels.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: assault_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: saw_them_hurt_someone}
    - kind: create_rumour
      target: assault_onlookers_of(trigger.event_id)
      payload: {about: "$trigger.attacker", claim: hurt_someone}
  delay_s: 0
  cites: [D-126, docs/as/06_WORLD.md#6]
- schema: as.cascade.v1
  id: CAS-038
  description: A threat made with a weapon in hand leaves whoever it was made to afraid of the one who made it.
  trigger_event: SPEECH
  where: {armed: true}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: threatened_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: threatened}
  delay_s: 0
  cites: [D-126, TEMPER-03]
# D-129 — what is done to you and yours lasts (the owner: "If I treat them like shit, or do something just
# absolutely evil. I do expect reactions, and proper ones."). Anger at a theft, an insult or a loved one hurt
# fades by the hour (TEMPER-03); now the theft, the harm to their own, the shaming and the watching do not.
# The player's character is never one of those changed (C06), except for what being made to watch costs.
- schema: as.cascade.v1
  id: CAS-039
  description: Seeing someone take what is yours costs them your trust, and you hold it against them.
  trigger_event: ITEM_TRANSFER
  where: {}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: robbed_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: robbed_by}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: robbed_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: robbed_by}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: robbed_by(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} took what was yours.", strength: 2}
  delay_s: 0
  cites: [D-129, TEMPER-03]
- schema: as.cascade.v1
  id: CAS-040
  description: Seeing someone hurt a person you love, who was not fighting them, is not forgiven.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.attacker_provoked == false"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: bonded_onlookers_of(trigger.event_id)
      payload: {toward: "$trigger.attacker", axis: trust, delta: -1, cause: hurt_my_own}
    - kind: emit_event
      event_type: LOOP_OPENED
      target: bonded_onlookers_of(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.attacker", text: "{subject} hurt someone you love.", strength: 2}
  delay_s: 0
  cites: [D-129, TEMPER-03]
- schema: as.cascade.v1
  id: CAS-041
  description: Seeing someone kill a person you loved, who was not fighting them, leaves a grudge that does not let go.
  trigger_event: DEATH
  where: {}
  preconditions: ["trigger.killer_provoked == false"]
  effects:
    - kind: emit_event
      event_type: LOOP_OPENED
      target: bonded_onlookers_of(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.killer", text: "{subject} killed someone you loved.", strength: 3}
  delay_s: 0
  cites: [D-129, D-119]
- schema: as.cascade.v1
  id: CAS-042
  description: Being insulted in front of others wears a person down, and they resent the one who did it.
  trigger_event: SPEECH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: humiliated_by(trigger.event_id)
      payload: {cause: humiliated_publicly}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: humiliated_by(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: resentment, delta: 1, cause: humiliated}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-043
  description: Being held and made to watch someone you love hurt breaks something in a person.
  trigger_event: HARM
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: made_to_watch(trigger.event_id)
      payload: {cause: made_to_watch}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-044
  description: Being held and made to watch someone you love die breaks something in a person.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: drain_resolve
      target: made_to_watch(trigger.event_id)
      payload: {cause: made_to_watch}
  delay_s: 0
  cites: [D-129, docs/as/05_ACTORS.md#5]
# D-133 — eating the dead (the owner: "If I ... do something just absolutely evil. I do expect reactions, and proper
# ones."). Whoever sees someone cut meat from a person's body trusts them less, is afraid of them, is shaken, and tells
# it; whoever loved the dead never forgives it; the one who does it carries it, whoever they are.
- schema: as.cascade.v1
  id: CAS-045
  description: Seeing someone cut meat from a person's body costs them your trust, leaves you afraid of them and shaken, and the story travels.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: ate_the_dead}
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: fear, delta: 1, cause: ate_the_dead}
    - kind: adjust_stress
      target: onlookers_of_act(trigger.event_id)
      amount: 2
    - kind: create_rumour
      target: onlookers_of_act(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: ate_the_dead}
  delay_s: 0
  cites: [D-133]
- schema: as.cascade.v1
  id: CAS-046
  description: Seeing someone cut meat from the body of someone you loved is never forgiven.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: LOOP_OPENED
      target: onlookers_bonded_to_target(trigger.event_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} cut meat from the body of someone you loved.", strength: 3}
  delay_s: 0
  cites: [D-133]
- schema: as.cascade.v1
  id: CAS-047
  description: Whoever cuts meat from a person's body carries it afterwards, whatever drove them to it.
  trigger_event: ACTION_START
  where: {def_id: butcher_human}
  preconditions: []
  effects:
    - kind: adjust_stress
      target: actor(trigger.actor_id)
      amount: 2
    - kind: drain_resolve
      target: actor(trigger.actor_id)
      payload: {cause: self_disgust}
  delay_s: 0
  cites: [D-133, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-048
  description: Hearing, from someone they believe, that a person cut meat from the dead costs that person the listener's trust.
  trigger_event: RUMOUR_SPREAD
  where: {claim: ate_the_dead, believed: true}
  preconditions: ["trigger.payload.hops >= 1"]
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: actor(trigger.payload.listener_id)
      payload: {toward: "$trigger.payload.about_id", axis: trust, delta: -2, cause: rumour}
  delay_s: 0
  cites: [D-133, INFO-02]
