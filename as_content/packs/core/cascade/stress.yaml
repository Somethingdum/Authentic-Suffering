# Stress (H1): what wears a person down, and what takes the edge off (actors.stress 0..10; mind.temper
# reads it: the more strained, the shorter the fuse). Numbers are small on purpose — it adds up.
- schema: as.cascade.v1
  id: CAS-019
  description: Seeing someone die strains everyone who saw it, and more the closer they were to the dead.
  trigger_event: DEATH
  where: {}
  preconditions: []
  effects:
    - kind: adjust_stress
      target: witnesses_of(trigger.event_id)
      amount: 2
      payload: {scale_by: bond_to_subject}
  delay_s: 0
  cites: [TEMPER-02, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-020
  description: Hunger and thirst past the first pangs wear a person down.
  trigger_event: NEED_STAGE
  where: {}
  preconditions: ["trigger.payload.stage >= 2"]
  effects:
    - kind: adjust_stress
      target: actor(trigger.payload.body_id)
      amount: 1
  delay_s: 0
  cites: [TEMPER-02]
- schema: as.cascade.v1
  id: CAS-021
  description: A night's unbroken sleep takes the edge off and gives back a little Resolve.
  trigger_event: AWARENESS_CHANGE
  where: {awareness: awake, from: asleep}
  preconditions: ["trigger.payload.slept_ms >= 21600000"]
  effects:
    - kind: adjust_stress
      target: actor(trigger.payload.body_id)
      amount: -2
    - kind: recover_resolve
      target: actor(trigger.payload.body_id)
      payload: {cause: safe_night}
  delay_s: 0
  cites: [TEMPER-02, SLEEP-01, docs/as/05_ACTORS.md#5]
# --- H1 consequences: not always violence, and they last.
- schema: as.cascade.v1
  id: CAS-022
  description: Shoving someone to the dead costs the one who did it the trust of everyone who saw it, and the story travels.
  trigger_event: ACTION_START
  where: {def_id: shove_toward_dead}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: RELATION_CHANGE
      target: onlookers_of_act(trigger.event_id)
      payload: {toward: "$trigger.actor_id", axis: trust, delta: -2, cause: fed_someone_to_the_dead}
    - kind: create_rumour
      target: onlookers_of_act(trigger.event_id)
      payload: {about: "$trigger.actor_id", claim: fed_someone_to_the_dead, seen: true}
  delay_s: 0
  cites: [TEMPER-06, docs/as/05_ACTORS.md#7.1]
- schema: as.cascade.v1
  id: CAS-023
  description: Whoever was shoved to the dead, if they live, never forgets it.
  trigger_event: ACTION_START
  where: {def_id: shove_toward_dead}
  preconditions: []
  effects:
    - kind: emit_event
      event_type: LOOP_OPENED
      target: actor(trigger.payload.target_id)
      payload: {kind: grudge, subject: "$trigger.actor_id", text: "{subject} shoved you to the dead.", strength: 3}
    - kind: drain_resolve
      target: actor(trigger.payload.target_id)
      amount: 1
      payload: {cause: betrayed}
  delay_s: 0
  cites: [TEMPER-07]
# --- I1: seeing someone eaten alive.
- schema: as.cascade.v1
  id: CAS-024
  description: Every bite someone sees the dead take out of a person or an animal wears them down; watching a whole feeding breaks people.
  trigger_event: HARM
  where: {type: bite}
  preconditions: []
  effects:
    - kind: adjust_stress
      target: witnesses_of(trigger.event_id)
      amount: 1
  delay_s: 0
  cites: [INF-15, docs/as/06_WORLD.md#5]
# D-123 — what wears the will down (05 §5): severe pain, going hungry, going without sleep.
- schema: as.cascade.v1
  id: CAS-033
  description: A severe wound's pain shakes a person's will.
  trigger_event: HARM
  where: {}
  preconditions: ["trigger.payload.severity != 'minor' and trigger.payload.severity != 'significant'"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.payload.body_id)
      payload: {cause: severe_pain}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-034
  description: Every new stage of hunger wears a person's will down.
  trigger_event: NEED_STAGE
  where: {need: hunger}
  preconditions: ["trigger.payload.stage >= 1"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.payload.body_id)
      payload: {cause: starving_day}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
- schema: as.cascade.v1
  id: CAS-035
  description: A day and more without sleep wears a person's will down, and more every eight hours after.
  trigger_event: NEED_STAGE
  where: {need: fatigue}
  preconditions: ["trigger.payload.stage >= 3"]
  effects:
    - kind: drain_resolve
      target: actor(trigger.payload.body_id)
      payload: {cause: sleepless_night}
  delay_s: 0
  cites: [D-123, docs/as/05_ACTORS.md#5]
# D-139 — 05 §5's last recovery: putting yourself between someone you look after and the danger gives a little back.
# Once a day, however often: shielding someone is not a way to fill yourself back up.
- schema: as.cascade.v1
  id: CAS-058
  description: Putting yourself between someone you look after and the danger gives back a little Resolve, once a day.
  trigger_event: ACTION_START
  where: {def_id: shield_dependent}
  preconditions: []
  effects:
    - kind: recover_resolve
      target: protecting_today(trigger.event_id)
      payload: {cause: protected_dependent}
  delay_s: 0
  cites: [D-139, docs/as/05_ACTORS.md#5]
# D-146 — broken nights. Under that much strain sleep does not hold: three hours in, they wake and it does not come
# back (no safe night, so no Resolve given back — CAS-021 asks for six hours). The player's character too: what wakes
# them is the body's, not a feeling written into them.
- schema: as.cascade.v1
  id: CAS-061
  description: Lying down to sleep under heavy strain, a person wakes three hours in.
  trigger_event: POSTURE_CHANGE
  where: {awareness: asleep}
  preconditions: ["actor(trigger.payload.body_id).stress >= 8"]
  effects:
    - kind: schedule_event
      event_type: AWARENESS_CHANGE
      target: actor(trigger.payload.body_id)
      payload: {due_s: 10800, cause: nightmare}
  delay_s: 0
  cites: [D-146, SLEEP-01]
- schema: as.cascade.v1
  id: CAS-062
  description: Falling asleep where they stand under heavy strain, a person wakes three hours in.
  trigger_event: AWARENESS_CHANGE
  where: {awareness: asleep}
  preconditions: ["actor(trigger.payload.body_id).stress >= 8"]
  effects:
    - kind: schedule_event
      event_type: AWARENESS_CHANGE
      target: actor(trigger.payload.body_id)
      payload: {due_s: 10800, cause: nightmare}
  delay_s: 0
  cites: [D-146, SLEEP-01]
