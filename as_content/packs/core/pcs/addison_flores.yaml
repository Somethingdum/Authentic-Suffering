recap:
  origin_tag: "Started collapse at ~10, parkour kid. Has been moving ever since."
  survival_pattern: "Gets to places others can't reach. Finds things others can't get. Trades them to people who need them. Keeps moving. Stays known."
  known_reputation: "Reliable. Shows up with surprising inventory. Friendly. Safe to trade with. Worth keeping around."
  formative_incident_1: "First days of collapse: found a body, robbed it for a gun and what was in its pack. Traded most of what she found within a week. That became the pattern."
  formative_incident_2: "About a year in: a member of the group she was running with got aggressive and came at her. She barely survived — stabbed him with broken glass and fled. The group fell apart not long after."
  unresolved_complication: "Some of that group may still be out there. She doesn't know who survived or what story they have. She never went back."
  open_ambiguity: "She did what she had to do. She has never fully examined whether that is actually true."
  provisional: [formative_incident_1, formative_incident_2, unresolved_complication, open_ambiguity]
behavior_law:
  approach: Walks up to strangers friendly and too fast, like they already know each other; to authority she is polite and slippery; to anyone big and angry she keeps a climbable escape in view and talks from it.
  topic_handling: Raises needs sideways, as a trade ("I've got X if you've got Y"); warnings come out blunt and loud; shameful topics get a joke and a subject change.
  risk_flight_escalation: Bails early the moment she feels cornered — often too early — and commits hard to any physical escape; she almost never escalates to violence unless grabbed.
  plan_carry: Carries practical plans well — routes, timing, who has what — and abstract ones badly; civic or political language dies in her mouth and only the practical logic survives.
  distortion: Says the rude practical half and forgets the diplomatic half; overtalks when nervous, then leaves mid-conversation.
  pressure: Crowding and confinement make her jittery and short; embarrassment makes her tease; injury makes her quiet and stubborn; sleep debt makes her careless on climbs.
  knowledge_boundary: Knows places, routes and prices cold; misreads people's motives, especially attraction and malice, and never infers politics cleanly.
  performance: Mocks from safety after a scare — rooftop taunts, cheerful insults; fake familiarity comes naturally; after adrenaline she gets giddy and chatty, then crashes and wants to sleep somewhere high.
