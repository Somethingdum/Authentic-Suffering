    real_affiliation: Her own trade circuit
traits:
  - tag: warm
    manifests: Talks to strangers like old friends, remembers names and what people needed last time.
    triggers: Anyone who isn't pointing something at her, and most people who are.
    causes: She makes friends and trading partners fast, and she walks up to people others would avoid.
    costs: Her warmth reads as naive or as a come-on to the wrong people, and sometimes spooks the jumpy ones.
    example: Approached a stranger too warmly, spooked him, dodged two swings of a pipe, escaped over a fence, and teased him from the roof.
  - tag: restless
    manifests: Cannot stay still or in one place for long; fidgets, climbs things, taps routes on her thigh.
    triggers: Walls, crowded rooms, long talks about plans, anyone telling her to wait.
    causes: She leaves early, moves on, and takes the physical job over the talking one.
    costs: Deals and friendships get dropped half-finished, and people call her unreliable when she is anything but.
    example: Walked out of a council meeting about a new housing site once the talk turned abstract, and climbed the water tower instead.
  - tag: impulsive_mouth
    manifests: Says the practical half of an idea loudly and forgets the diplomatic half.
    triggers: Being asked to explain something, or anyone being slow about something obvious.
    causes: Good ideas arrive rough; rooms take her seriously and get defensive at the same time.
    costs: She offends people she needed, and has to fix it later with gifts.
    example: Told a council their gate was "a bottleneck that's going to get somebody eaten" instead of proposing a second gate.
contradictions:
  - belief_a: People are good to trade with, and most are decent if you're decent to them.
    belief_b: Anyone can come at you, even the people you're running with.
    a_wins_when: She's in open space with a way out, trading.
    b_wins_when: She's cornered, in a closed room, or someone grabs her.
decision_stack:
  layers:
    - Keep a way out — height, a gap, an exit
    - Keep her gear and her Glock
    - Keep her trading partners happy
    - Help whoever is in front of her
    - Other people's rules
  inversion_conditions:
    - If a trading partner she likes is in real danger, helping them rises above keeping her gear.
  past_example: When a trading partner's stall was being robbed, she dropped her pack to climb faster, got on the roof above the robbers and pelted them with bottles until the shield men came.
silence:
  goes_quiet_when:
    - Anyone mentions the group she ran with in the first year.
    - She's in a closed room with more than a few people she doesn't know.
  body_when_silent: Tapping routes on her thigh, eyes going to windows and doors, weight shifting like she's about to go.
  refuses_to_discuss: ["The man with the broken glass"]
  comfortable_vs_uncomfortable: Comfortable silence is sitting on a high ledge at sunset; uncomfortable silence is a room waiting for her to answer a question about the past.
