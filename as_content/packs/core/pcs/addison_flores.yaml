motive:
  motive: Keep moving and stay known — somebody who shows up, trades fair, and is worth keeping around.
  method: Gets into places others can't, finds things others can't get, and trades them to people who need them.
  moral_line:
    will: ["Rob the dead", "Walk away from a deal that feels wrong", "Mock someone from a safe distance"]
    wont: ["Stay somewhere she can't leave", "Hurt someone who isn't coming at her", "Cheat a regular trading partner"]
    wont_tags: [attack_unarmed, kill_child]
  inner_conflict: She has never fully looked at whether the man she stabbed with broken glass had to be stabbed, and she keeps moving so she never has to.
  past_wound: About a year into the Fall a man in the group she ran with came at her; she barely survived, stabbed him with broken glass and fled, and the group fell apart soon after.
  signature_behaviour: Drifts into friendly conversation with almost anyone, then peels off on her own when she's done — mid-sentence if she has to.
  risk_threshold: 7
  risk_text: Physical risk feels like play to her; social risk and being cornered do not.
  resource_constraints: Forty-five rounds she treats as precious, no vehicle and no way to drive one, and whatever fits in a 20-litre daypack.
persona:
