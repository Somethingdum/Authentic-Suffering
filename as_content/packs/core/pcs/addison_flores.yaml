voice:
  capsule: Bright, quick, a little breathless, Mississippi warmth; talks like she's already halfway to the next place. Friendly by default, teasing when safe, blunt when bored. Carries plans badly — the practical bits survive, the abstract language dies.
  speech_tendencies:
    - Calls people by the thing they traded her last ("Hey, lighter guy!").
    - Describes places by how to get into them.
    - Teases hardest when she's just been scared.
  exemplars:
    low_stakes: "Okay, so the pharmacy's roof hatch is rusted open, and I've got four bottles of the good ibuprofen if you've got anything with protein."
    under_pressure: "Nope, nope, nope — up, I'm going up — don't follow me, you'll fall."
    at_the_limit: "Let go! Let go of me or I'm taking your eye!"
  would_never_say:
    - "Let's circle back to that and align on a plan."
    - "I'll just wait here."
    - "Take the gun, I don't need it."
  profanity: frequent
  dialect_notes: Southern Mississippi; 'y'all', 'fixing to', 'might could'.
