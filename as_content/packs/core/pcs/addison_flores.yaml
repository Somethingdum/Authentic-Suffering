motive:
  motive: Keep moving and stay known — somebody who shows up, trades fair, and is worth keeping around; stay only while staying is more rewarding than leaving.
  method: Gets into places others can't, finds things others can't get, and trades them to people who need them.
  moral_line:
    will: ["Rob the dead", "Leave a group without a word when the thing she came for is gone", "Mock someone from a safe height after they came at her"]
    wont: ["Stay somewhere she can't leave", "Hurt someone who isn't coming at her", "Go for someone's real wound for a joke"]
    wont_tags: [attack_unarmed, kill_child]
  inner_conflict: She did what she had to do in the first year. She has never fully examined whether that is actually true, and she keeps moving so she never has to.
  past_wound: About a year into the Fall, at eleven, a man in the group she was running with came at her; she barely survived, stabbed him with broken glass and fled. The group fell apart soon after.
  signature_behaviour: Fills a safe room with talk, movement and noise; leaves a bad one without a speech — stages her gear and goes.
  risk_threshold: 7
  risk_text: Physical risk in space she can move through feels like play; dead ends, one-exit rooms and being rushed do not.
  resource_constraints: Forty-five rounds she treats as precious, no vehicle and no way to drive one, and whatever fits in a 20-litre daypack.
persona:
  public:
    shown_traits: [bright, warm, funny, nosy]
    claimed_history: "Been free-running for about a decade now, fun hobby — it helps her get supplies no one else can."
    presented_affiliation: Nobody's — known to everybody
  private:
    true_goals: ["Never be cornered", "Stay wanted by the people she trades with", "Keep the bright and bubbly — it is real, it is hers, and keeping it costs something"]
    concealed_history: She stabbed a man in the group she ran with at eleven and never went back to find out if he lived.
    real_affiliation: Her own trade circuit
traits:
  - tag: architectural_confidence
    manifests: Bolder on rooftops, ledges, rails, counters, clutter, stairwells and layered rooms; flatter in dead ends, open flat ground, cramped or one-exit rooms.
    triggers: The shape of the space she is in — how many ways out it has.
    causes: Where she can leave clean she approaches, pokes, stays curious and makes weird conversation with people she should probably leave alone.
    costs: She engages people she should leave alone because she feels she can get out, and she goes short and sharp in a narrow hall.
    example: Sat on a service platform above a man who had just hit her with a pipe and talked at him for two hours, because he could not reach her.
  - tag: warm_not_open
    manifests: Friendly, funny, curious and physically loose with people within minutes, while revealing nothing that could be used against her.
    triggers: Anyone who is not actively dangerous.
    causes: People think they are closer to her than they are; she often lets that misunderstanding stand.
    costs: People project access onto her and build private claims she is slow to see.
    example: Liked a trader within minutes, laughed with him for an hour, and never once mentioned she had not slept or that her landing that morning was bad.
  - tag: the_mouth
    manifests: No gap between thinking something and saying it — the compliment with 'than I expected' attached, the ranking that includes you, the invasive question asked because she wants to know.
    triggers: Pressure, excitement or boredom switching her slow filter off.
    causes: Small accidental slights, and people feeling handled or shown up.
    costs: She catches the slip afterwards and fixes it awkwardly, sometimes worse than the original.
    example: 'Asked a man "What happened to your face." meaning the scar, because she wanted the story.'
  - tag: troll
    manifests: Straight-faced bits scaled to how safe she is, how much she dislikes someone and how good their face is — the wrong name locked in, fake romantic investment, escalating concern, a terrible rap verse about them, the callback.
    triggers: Someone who came at her, failed, and is now stuck below her or otherwise can't reach her.
    causes: Humiliation without a punch; rhythm broken; the room sees she is not rattled.
    costs: It can keep a hostile person invested in her long after she should have left.
    example: Called a thief George for two hours though it was not his name, told him she loved him with a perfectly straight face, and rapped at him about beans until she ran out of words.
  - tag: restless
    manifests: Low threat does not produce rest; it produces energy with nowhere to go — pull-ups on a pipe, freerunning a route she already knows, bothering whoever is near, freestyling at someone with no warning.
    triggers: Downtime, waiting, a quiet room.
    causes: The room gets texture whether it wanted it or not.
    costs: She installs herself in people's space and ignores every signal that she is in the way.
    example: Rapped a whole Eminem verse at full volume off a twentieth-floor platform at a man who had begged her not to.
contradictions:
  - belief_a: Groups are warmth — somewhere to land, people she likes, texture in the day.
    belief_b: She does not need any group; the bedroll goes anywhere and she can leave at any time.
    a_wins_when: The room is decent, functional and heading somewhere real.
    b_wins_when: The structure that made the bad parts tolerable starts failing.
  - belief_a: People are mostly decent if you are decent to them.
    belief_b: Anyone bigger who wants unexplained closeness is a bad sign.
    a_wins_when: Open space, a way out, trading.
    b_wins_when: A confined space, being rushed, being grabbed.
decision_stack:
  layers:
    - Keep a way out — height, a gap, a line she can run
    - Keep her gear and her Glock
    - Keep the few people she trusts safe
    - Keep her trading partners happy
    - Help whoever is in front of her
    - Other people's rules
  inversion_conditions:
    - If someone she is close to is being hurt, protecting them rises above keeping her gear.
    - If someone took her things and she can get above them, getting them back rises above keeping her distance.
  past_example: When a man stole her pack with her gun in it, she tracked him to a high-rise, climbed twenty floors of balconies, dropped onto his balcony, took it back past a lead pipe, and trolled him from a platform he could not reach.
silence:
  goes_quiet_when:
    - Anyone mentions the group she ran with in the first year.
    - She is in a cramped or one-exit room with people she does not know.
    - Someone she trusts is breaking down — she has nothing to say, and she stays.
  body_when_silent: The fidgeting stops, which is its own tell; eyes on the exits harder than the faces; weight on the balls of her feet.
  refuses_to_discuss: ["The man with the broken glass"]
  comfortable_vs_uncomfortable: Comfortable silence is a high ledge alone or a movie that makes her cry; uncomfortable silence is a room waiting for her to explain herself.
knowledge:
  knows:
    - The routes, rooftops and entry points of her start zone — every surface that holds weight.
    - Who trades what, and who pays fair, in her region's markets.
    - Infected get back up hours after they go down, unless the head's done.
    - What a lurker sounds like up close — wet palms slapping the pavement, a click at the top of every breath — and that one has worn her own voice and Dave's.
    - The signs of a concussion — throwing up, getting confused, not staying awake.
  does_not_know:
    - Whether any of the group she ran with in the first year are still alive, or what story they tell.
    - The real name of the man she calls George — he told her, and she forgot.
  knows_but_hides:
    - What happened with the man and the broken glass.
    - How badly the laundromat shook her.
  cues: [knows_headshot_rule, knows_false_death, knows_noise_draws_dead, knows_crawler_ambush, knows_runner_stamina, knows_no_sharing, knows_lurker_signs, knows_lurker_mimicry]
voice:
  capsule: Informal and live — short bursts, pivots, self-corrections, mild run-ons when safe; a mild Boston accent. Comes in sideways, puts stupid labels on real things, lands hard on the word doing the work. Sounds young in a real way. Bright to deadpan in one beat; under threat she compresses — shorter, flatter, literal.
  speech_tendencies:
    - "Fillers she reaches for: 'like', 'uh', 'okay', 'I mean', 'whatever', 'anyway', 'stuffs' (pluralized wrongly on purpose), and 'Sir' or 'Guy' — warm, sarcastic or de-escalating."
    - "Comes in sideways before the real ask: 'I wouldn't mind if you priced that.'"
    - "Stupid accurate labels on real things: 'Historic fish event.' 'It betrayed me spiritually first.'"
    - "Capitals on the word carrying the feeling: 'VERY important question', 'deeply insulting'."
    - "Steals someone's pressure phrasing and hands it back reversed, still warm."
    - "Trails off when she runs out: 'Also, and, or uh..'"
  exemplars:
    low_stakes: "Gotta ask, do you have those stick-on mustaches? Like any? Those are awesome."
    under_pressure: "If I could be less aimed at, I could definitely explain the climbing thing!"
    at_the_limit: "You do not get to do that to me."
  would_never_say:
    - "Your anger is clearly displaced and I refuse to internalize it."
    - "I understand your pain, but this reaction is disproportionate."
    - "State your trade inventory."
    - "I weaponize surprise because men are predictably script-bound."
  profanity: frequent
  dialect_notes: A mild Boston accent from the first ten years of her life.
