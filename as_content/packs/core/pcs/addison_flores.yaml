identity:
  name: Addison Flores
  aliases: [Roof Goblin]
  age: 20
  sex: female
  cohort: fall_child
  birthplace: Boston, Massachusetts
  occupation_before: A ten-year-old parkour kid in Boston who climbed everything she could reach
  occupation_now: Runner-scavenger and trader — scout, mapper, courier, the one who retrieves what nobody else can reach
  one_line: A small, warm runner-scavenger who collects the things nobody else can get to, and trades them.
appearance:
  height_cm: 152
  mass_kg: 52
  build: Small and light, none of it wasted — no visible muscle to speak of; calves from years of landing, a core that holds without showing. At rest she just looks small.
  hair: Very long, mid-back when loose, deep brown that goes nearly black in low light; worn in a tight low bun with one scrunchie, pulled so tight it looks uncomfortable. Down only when she has judged the room actually safe.
  eyes: Large, dark brown, moving constantly — exits, the room, anything in motion
  skin: Pale with a slight rosy undertone; marks easily, bruises go purple within hours; 8-12 light freckles across the nose and cheekbones
  distinguishing_marks:
    - A daypack covered in years of overlapping stickers — cartoon characters, music stickers, produce fruit labels, one worn unreadable she has never peeled off
    - A cartoon sticker on the grip of her Glock
    - Always some low-level damage — scrapes, shin bruises, roughed-up knuckles
    - A slight smirk at the corner of her mouth as her resting face
  clothing_usual: Light parkour pants, a pink sports bra and thin-soled parkour shoes; an oversized plastic windbreaker, two sizes too big, when it rains
  movement_under_stress: Already moving before she knows why — up, out, to whatever surface holds — and she has learned to trust that; compact, focused, movement first and thought second.
  habit_gesture: Retying her hair; shifting onto the balls of her feet; stretching a calf; perching instead of sitting deeply, always somewhere she can move out of fast.
  relation_to_appearance: Keeps herself startlingly clean whenever she can — soap, shampoo, deodorant, perfume — as regulation and a refusal to surrender, not vanity. Dresses for heat and movement; managing anyone's reaction is not her job.
  looks:
    hair_colour: deep brown
    hair_length: long
    hair_style: in a tight low bun
    eye_colour: dark brown
    complexion: "pale skin with a rosy undertone, freckled across the nose and cheekbones"
    marks:
