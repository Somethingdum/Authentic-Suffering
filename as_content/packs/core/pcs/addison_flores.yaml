writers_notes: Write her from the owner's writer's bible (DECISIONS D-109). She reacts before she thinks; her confidence is architectural; warmth is cheap and trust is expensive; she is not rude by default (warm, shorter, flatter, clipped, gone); she does not perform sexuality as baseline; cornered or rushed she panics messily, never coolly; she is hard to crash out; the bright and bubbly is real and earned and keeping it costs something. She was ten at the Fall and has been in hell since; she has survived at least three mega hordes. She is not a marksman and would rather not fire.
