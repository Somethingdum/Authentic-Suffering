# Addison Flores — the reference playable character. Canon: CMG §61 Part XV (the card, start facts,
# inventory, recap), the owner's writer's character bible and the owner's canon event "the
# laundromat" (DECISIONS D-109). The owner's rulings (2026-09-26): from Boston, ten at the Fall,
# moved south after it; pale; a mild Boston accent; light parkour pants replace the skort; she has
# survived at least three mega hordes. Write her from the bible: she reacts before she thinks.
