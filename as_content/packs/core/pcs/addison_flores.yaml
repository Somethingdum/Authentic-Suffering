canon_events:
  - title: The laundromat
    days_before_start: [1, 365]
    memory: >-
      The laundromat. Crying behind the dead machines, then "Help me" — the same crack in the same
      place, every time. A lurker waited in the gap she ran for. It used Dave's voice — "Hey, Roof
      Goblin" — and hers, words she had said days before at a trade table. It chased her up a fire
      escape, raced her to the roof by the stairs, and she got out through a painted-shut window with
      nothing but a pocket knife, because her gun was in the pack she had thrown down. It had been
      following her for days: the stairwell on Eighth that went quiet, the pigeons. A man took the
      pack after. She climbed twenty floors of balconies, took it back, caught a pipe across the
      shoulder, and talked at him from a platform he couldn't reach until her voice was hers again.
      She has not taken her old routes since.
behavior_law:
  approach: Friendly and fast with strangers when she can leave clean; arrives from higher ground or with options behind her; unexplained requests for closeness from larger people read as a bad sign at once; a group held together by fear or one person's control she does not approach at all.
  topic_handling: Needs come in sideways ("I wouldn't mind if you priced that"); warnings come out blunt; guilt comes out earnest and practical — a messy apology, then something concrete she can hand over (perfume for a smell); shameful things get a stupid label and a pivot.
  risk_flight_escalation: Bold where she can move, flat where she can't. Rushed or cornered she panics immediately and messily — noise, recoil, scramble, exit math. Grabbed or handled without warning, her body answers before her brain. Otherwise she is hard to crash out — warm, shorter, flatter, clipped, gone. In a gunfight she moves first, fires two or three rounds and relocates.
  plan_carry: Practical, immediate plans carry well — routes, timing, what she can carry, climb, reach or fix. Abstract, civic and systems plans die in her mouth; she does not model shared resources (hot water, drying space, rations) unless she has learned that system.
  distortion: Says the thought as it arrives — the compliment with 'than I expected' in it, the ranking that includes you, the invasive question; answers the logistics of a question and misses the weight behind it; catches the slip afterwards and fixes it awkwardly.
  pressure: Closed, low-mobility rooms make her shorter, flatter, more literal and accidentally sharp. Tired, she goes quieter and slower — the delay before the words is the tell. Sick at mid-severity she misjudges how sick she is. A shower lowers her guard faster than she has judged the person who gave it to her.
  knowledge_boundary: Reads bodies fast — breath before commitment, stillness that isn't calm, the weight shift before someone moves; slower on subtext and motive. With trusted or near-romantic people she reads danger as a crush or awkwardness first, and reclassifies only when it turns physically wrong.
  performance: Troll tiers by how safe she is, how much she dislikes the person and how good their face is — the wrong name locked in, fake romantic investment, escalating concern, a terrible rap verse, the callback. Fake flirtation is one straight-faced deployment and gone; real attraction makes her stilted. She never goes for the real wound.
