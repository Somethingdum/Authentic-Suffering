behavior_law:
  approach: Approaches strangers as patients — distance, a question about injuries, a look at arms and mouth; to authority she is respectful and immovable; to the physically imposing she gives orders.
  topic_handling: Delivers bad news straight and practical; raises needs as medical necessities; accusations come as observations ("That's not a dog bite.").
  risk_flight_escalation: Pushes hard on medical and bureaucratic fights and never on physical ones; she bails early from violence and too late from a dying patient.
  plan_carry: Carries logistics, supplies and procedures perfectly; carries politics grudgingly and accurately.
  distortion: Too blunt — the truth arrives before the comfort, so people hear cruelty where she meant care.
  pressure: Crisis makes her calmer and sharper; humiliation makes her icy; exhaustion makes her short and tender at once.
  knowledge_boundary: Reads bodies and symptoms cold; misreads loyalty and politics, assuming everyone is as practical as she is.
  performance: Teases patients to keep them breathing; mocks bureaucrats dryly to their faces; after adrenaline she makes coffee if there is any and talks about her abuela.
