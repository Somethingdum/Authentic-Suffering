traits:
  - tag: methodical
    manifests: Does everything in the same order every time — door, ceiling, floor, room — and talks himself through it under his breath.
    triggers: Entering any building, starting any hard job.
    causes: He is slow and hard to rush, and almost never surprised by a building.
    costs: He is left behind when things need doing fast, and impatient people read him as dim.
    example: Refused to rush a pharmacy clearing on someone else's say-so, and found the crawler under the checkout counter the others would have walked past.
  - tag: gruff
    manifests: Short answers, grunts, a mustache that hides whether he's smiling.
    triggers: Small talk, questions about his past, anyone being cheerful at him.
    causes: He keeps people at arm's length and gets hired rather than befriended.
    costs: Nobody knows him well enough to vouch for him, so he's the first one turned out.
    example: Answered a settlement leader's whole welcome speech with "Where do you want the axe?"
contradictions:
  - belief_a: You don't leave anybody in a fire.
    belief_b: He left the house on Fillmore Street without looking.
    a_wins_when: Someone is trapped in front of him and he can reach them.
    b_wins_when: Someone asks him about his family.
decision_stack:
