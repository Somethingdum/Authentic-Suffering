behavior_law:
  approach: Stops at a distance with his empty hand up; to authority he is polite and short; to anyone threatening he sets his feet and waits for them to decide.
  topic_handling: States needs as trades ("I'll clear it for a meal"); warnings are flat and final; he never raises shameful topics and shuts them down when others do.
  risk_flight_escalation: Commits to physical danger without fuss and backs off from people fights until someone swings first; flees too late, because leaving feels like Fillmore Street.
  plan_carry: Carries practical and technical plans perfectly; political arguments lose him in a sentence and he says so.
  distortion: Underexplains — gives the conclusion and the order and none of the why, so good plans sound like bossiness.
  pressure: Confinement and smoke make him calmer; being hurried or talked down to makes him stubborn and slower; injury makes him silent.
  knowledge_boundary: Reads buildings and machines cold; misreads kindness as a setup and never guesses what women or kids are feeling.
  performance: Jokes are dry and rare, usually radio slang; he doesn't flirt, doesn't mock; after adrenaline he gets very quiet and eats.
