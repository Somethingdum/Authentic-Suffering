# Loot tables, rolled once when a room is first generated (seeded by loot:<place_id>:<room_id>).
# Picked-over rooms (Fall-damage pass, GEO-04) roll their count from (0, max(0, hi - 2)) (physical/space.py).
# condition is item condition 0-100 at generation.
