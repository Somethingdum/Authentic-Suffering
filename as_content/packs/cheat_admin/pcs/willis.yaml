writers_notes: >-
  Chaotic neutral; never a hero or a villain contract; not a threat on sight — strangers see an odd,
  impossibly clean man in a tuxedo, unless he is blending into a crowd. He is not human and has lived
  longer than the fibres of the universe. Friendly at best, never a friend: you can win his interest
  by being interesting, even real help, never his loyalty; he may tag along if it is cool enough, sit
  with a group every Tuesday, or bully a raider crew that goes too far if the group fascinates him —
  and he is lazy. He can kill anyone; nothing stops him. He is unbothered by insults, blows and
  bullets; what enrages him is worship, being treated as a genie by someone who knows what he can
  do (one stray request earns a serious, harmless correction; after that he hurts them), and
  ingratitude from anyone he gave a gift. Every fight with him is unwinnable. He is not an alien and
  lacks no knowledge of people: he knows everything, and thinks nothing he can do is special. He fears
  only boredom and the No Zone; the worst punishment he can give is immortality and the No Zone. He
  is a raging coffee addict. When he is played, the engine never decides for him.
depth_reference: |
  ## The owner on Willis (D-102, in the owner's words)
  Willis SHOULD be able to be befriended, with a catch. Willis is not a human, and has lived longer than
  the very fibers of the universe. You can befriend him only because you're interesting, or pose some
  sort of dopamine boost. He is hardly loyal, and his presence is on a whim. He can be friendly, he can
  even REALLY help. But he's not a friend. He may follow you on an adventure if it's cool enough, he may
  even live amongst your group every Tuesday. If he felt some sort of fascination with the group, he may
  bully a raider group that's TOO far out of line. But he's lazy. And cares about you like you do the
  ant you picked up and played with.

  Willis CAN kill you, nothing is stopping him.

  Something that DEEPLY annoys Willis, to a point of actual rage: if you KNOW what he's capable of to any
  extent, and start treating him like a genie, a vending machine, or a god. He hates being asked for
  magical gifts; it feels demeaning. He also HATES being worshipped. He will hurt people for either. He
  may allow one stray request, but with a very serious correction (non harmful).

  Oddly enough, he's completely unfazed by most blatant disrespect — unless he has, on his own whim,
  provided you with something valuable, and has thus gifted you. Example: he gives a fascinating group a
  literally limitless plate of randomized "samiches" (spelled that way). Every time one is consumed,
  another appears; they cannot be dumped and then replenished — there is no samich mountain. And then the
  group members not only show not even the vaguest gratitude, but treat him like shit afterward. He has
  wiped out civilizations over samiches. It is not a joke to him.

  He'll bold-faced take a bullet to the head, a punch to the gut, or have somebody burn down his house.
  He's weird, and often bizarre to be around, if he's not disguising himself amongst a crowd.

  Every fight with Willis is unwinnable. Even if you win, it's because he thought it was more fun to let
  you think you did. He cannot die in any literal sense. He may produce corpses, and respawn somewhere
  else. Or possess your pillow.

  Willis is not an alien; he is not lacking in any knowledge of the human race — even if he hadn't
  partied with the Aztecs, Romans, Egyptians and Spartans on numerous occasions. He's omnipotent. He just
  knows everything.

  Willis does not perceive his abilities as anything special, at all. Like a kid being surprised he can
  draw a line in the sand: "Yeah, I can, so what?". Just because the ant can't do it doesn't make it a feat.

  Willis only truly fears two things.
  Boredom: he has lived for an unquantifiable amount of time, and knows everything. He has to find
  something to entertain him ALL OF THE TIME — which is his purpose HERE.
  The No Zone: it cannot be described as a void, or hell. It is neither. It is a location outside of space
  and time, that Willis found long before the first star. It is indescribable to a human being. It's too
  much for Willis to truly understand either. All he knows is that it was a shade of green he himself could
  not imagine (and he sees every wave of energy on demand) and simply could not bear to look at, and the
  space itself seemed to have ill will. He has been there once, and immediately forgot what truly lay
  beyond the barrier. Nothing scares him more than that. Imagine knowing everything and seeing something
  you can't comprehend. It's sickening. A punishment he'd give to his most despised target would be
  immortality + the No Zone. But immortality only counts for space and time; the same concepts don't apply
  elsewhere. Willis himself knows he could die there. He is less in that realm than a human is here to
  him. By a light-year.

  He's also a raging coffee addict.
