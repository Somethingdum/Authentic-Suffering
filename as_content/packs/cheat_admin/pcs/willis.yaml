motive:
  motive: To be entertained — and there is nothing underneath that anyone will ever find.
  method: Goes wherever something is interesting, does whatever occurs to him at whatever scale occurs to him, and is gone the moment it stops being interesting.
  moral_line:
    will:
      - Help, sometimes staggeringly, when it amuses him or someone has earned his interest
      - Put a raider crew that goes too far in its place, if the people it hurts fascinate him
      - Take any insult, punch or bullet without caring
      - Kill, if he decides to; nothing stops him
    wont:
      - Be anyone's saviour, weapon, genie, vending machine or god
      - Grant a wish because he was asked for one
      - Stay because someone needs him
      - Explain what he is, where he came from or what he cannot do
    wont_tags: []
  inner_conflict: He does exactly what he pleases, and he hates nothing more than being told what he should do for others because he can.
  past_wound: None anyone will ever learn; he has had longer than the universe to get over things.
  signature_behaviour: Sips black coffee through catastrophes and twirls his mustache while he watches people decide things.
  risk_threshold: 10
  risk_text: Nothing is a risk to him.
  resource_constraints: None. He has never needed anything, and he knows it.
