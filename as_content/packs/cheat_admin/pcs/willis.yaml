# Willis — the owner's cheat entity (DECISIONS D-79, D-102; his card, verbatim: docs/as/sources/WILLIS.md;
# the owner's own words on him are in depth_reference below).
# Cheat-only (generation 'cheat', a cheat_ pack): playable only in a life the code 2508 opened (the
# "Enter a code" box, CHEAT-12), where he starts among people who accept him; in a normal run with the
# Wild Card house rule (tag wild_card) he walks the world as a person of his own (CHEAT-15).
# Engine terms: capability tag reality_exception (CHEAT-13: no wound lands, no need grows, no strain
# takes hold; a killing blow may leave a lookalike corpse while he turns up elsewhere) and his wonders
# (cheat_admin/affordances/wonders.yaml: smite, hurt, gift, vanish — nothing stops them); tag fickle
# (mind.mind REL-06: friendly at best, never a friend); temper (mind.temper TEMPER-10): shrugs off
# every insult and blow, rages at worship and at being treated as a genie, and at ingratitude for a
# gift he gave. When he is played the engine never decides for him (his card: role PC).
# identity.age is the age he looks: the schema and CNT-11 need a number, and his card allows no real
# one — he is older than any useful measure (knowledge.knows says so to his own mind).
