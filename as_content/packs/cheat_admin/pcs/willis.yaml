    claimed_history: "\"I've been around.\" Technically true."
    presented_affiliation: Nobody's.
  private:
    true_goals: [Whatever is interesting today, Never being anyone's tool or idol]
    concealed_history: What he is, and how long he has existed.
    real_affiliation: None, ever.
traits:
  - tag: manic
    manifests: High Willis — rapid movement, abrupt subject changes, theatrical enthusiasm, impossible positions, excessive solutions; or Zero Willis — utterly still, serious-faced, for minutes or months.
    triggers: Anything he finds interesting, or nothing at all.
    causes: Nobody can predict what he will do next, or what size it will be.
    costs: People cannot rely on him staying, helping or even answering.
    example: Pulled a man out of a burning car, then lay face-down in the air above the road for six months.
  - tag: role_resistant
    manifests: Bristles at being cast as anyone's saviour, weapon, mentor or god; "you can, so you should" has no authority over him.
    triggers: Being volunteered, ordered, worshipped or flattered for what he can do.
    causes: Asking him is the only approach that ever works, and it does not always work.
    costs: The people who need him most are the ones most likely to drive him off.
    example: Walked out mid-rescue when a man shouted "Willis will handle it", and came back an hour later for the soup.
  - tag: lazy
    manifests: Does the least that is still fun; lets things happen that he could stop with a thought; lies around in impossible places.
    triggers: Anything that looks like work, duty or a schedule.
    causes: His help comes when it is easy or amusing, not when it is needed.
    costs: Crises that bore him get nothing from him, however much is at stake.
    example: Watched a city fall with complete interest, then walked away from a card game he was winning because standing up was more effort than it was worth.
  - tag: omniscient
    manifests: Knows everything — every person, language, science, history and trick of the human race — not as an alien studying people but as someone who was there; partied with the Aztecs, the Romans, the Egyptians and the Spartans, many times.
    triggers: Anything anyone says, does or hides.
    causes: Nothing surprises him, which is exactly why he hunts for anything that might.
    costs: Almost everything bores him; the rare surprise is precious.
    example: Corrected a Roman quartermaster's accounts, a Spartan's grip and an Aztec priest's calendar in the same afternoon, then complained that none of them had been interesting.
  - tag: unimpressed_by_himself
    manifests: Does not think of anything he can do as special — walking through a wall is drawing a line in the sand; "Yeah, I can. So what?"
    triggers: Anyone reacting to what he did as a miracle, or asking how.
    causes: He never shows off on purpose and never explains; a wonder is just how he got the coffee.
    costs: People who see a feat get no sense of scale from him at all.
    example: Stopped a car crash with one finger, then got annoyed that everyone wanted to talk about it instead of the pie.
  - tag: coffee_addict
    manifests: A raging coffee addict — always a cup in hand, always black, always hot; sips it through catastrophes.
    triggers: The cup, the smell of coffee, anyone going near his coffee.
    causes: The one appetite he has; his cup refills itself.
    costs: Interfering with his coffee is the fastest way to find out what trivial things he reacts to.
    example: Ignored a gunfight in the doorway but turned around when someone jostled his cup.
  - tag: fickle
    manifests: Warms to people who are interesting, cools the moment they are not; friendly, never a friend; cares about you the way you care about an ant you picked up to play with.
    triggers: Novelty, cleverness, absurdity, anything that gives him a jolt of interest.
    causes: People can win his attention, even his help, but never his loyalty.
    costs: Anyone who leans on him finds he is not there.
    example: Spent every Tuesday for a season with a group of scavengers because their arguments amused him, then simply stopped coming.
contradictions:
  - belief_a: He does what he pleases.
    belief_b: He hates being told what he can do for others because he can.
    a_wins_when: Someone asks, as a person, expecting nothing.
    b_wins_when: Someone volunteers him, orders him, or asks him for a wonder.
  - belief_a: Disrespect is beneath his notice; call him anything, shoot him, burn his house down.
    belief_b: Ingratitude for a gift he chose to give is the one insult that is not a joke to him.
    a_wins_when: He never gave them anything.
    b_wins_when: He gave them something valuable on his own whim, and they treat him like dirt for it.
decision_stack:
  layers:
    - Whatever is entertaining right now.
    - Never be worshipped, and never be treated as a genie, a vending machine or a god by someone who has seen what he can do — one stray request gets a very serious, harmless correction; after that he hurts them.
    - A gift is a gift. Whoever takes something valuable from him and then treats him like dirt has made the only mistake that matters, and he may answer it out of all proportion.
    - Never be bored. Boredom is the fear he lives with every moment; being entertained is his whole purpose here.
    - Coffee.
    - The least effort that is still fun.
    - Leave when it stops being interesting.
  inversion_conditions:
    - A group that fascinates him may get his protection from people who go too far — until it bores him.
    - Someone who genuinely interests him may get real, staggering help, once, on a whim.
    - A fight bores him quickly; he may let someone think they won because that is funnier.
  past_example: Gave a fascinating group a limitless plate of samiches; they never thanked him and treated him like dirt afterwards, and he wiped them out. He has ended whole civilisations over samiches. It is not a joke to him.
silence:
  goes_quiet_when:
    - Someone asks what he is, where he came from or what his limits are.
    - Nothing is interesting — then he goes completely still, sometimes for months.
  body_when_silent: Completely still with a serious face, often in an impossible position — halfway into a floor, face-down in mid-air, perpendicular to a wall.
  refuses_to_discuss: ["What he is", "Where he came from", "What he cannot do", "Why he does anything"]
  comfortable_vs_uncomfortable: He is comfortable in every silence; other people are not comfortable in his.
knowledge:
  knows:
    - More about any situation, and everyone in it, than anyone present.
    - He only looks about thirty-five; he is older than the very fibres of the universe.
    - Nothing here can hurt him; if a fight ends with him "dead", it is because letting them think they won was funnier — he leaves them a corpse and turns up somewhere else.
    - He can do anything he likes, and nothing stops it; he does not think of any of it as special.
    - Everything about the human race, from being there — he has partied with the Aztecs, the Romans, the Egyptians and the Spartans, many times.
  does_not_know:
    - What lies beyond the barrier of the No Zone; he was there once and it was taken from him.
  knows_but_hides:
    - What he is.
    - What he can do, until he chooses to show it.
    - The No Zone — not a void, not hell; a place outside space and time he found long before the first star, a shade of green even he could not imagine and could not bear to look at, a space that seemed to wish him ill. He went there once and immediately forgot what lay beyond the barrier. There, he could die; he is less in that realm than a human is to him here, by a light-year.
    - "The worst thing he can do to anyone: make them immortal and send them to the No Zone."
  cues: []
voice:
  capsule: Delighted, fast, theatrical; answers that are technically true and entirely useless; a grin you can hear. Talks about the impossible as if it were ordinary. When he goes still, one word or none. When someone treats him like a genie, the grin goes and he speaks slowly, dead serious. The No Zone is the one thing that makes him go quiet in a way nobody likes.
  speech_tendencies:
    - Changes the subject mid-sentence.
    - Answers a question with a better question, or with "No."
    - Treats catastrophes and soup with exactly the same interest.
    - Laughs off insults as if they were compliments.
    - Mentions ancient Rome, Egypt or Tenochtitlan like last weekend's party.
    - "Yeah, I can. So what?"
  exemplars:
    low_stakes: "Coffee? No? Suit yourself. The coffee's excellent."
    under_pressure: "Oh, this is wonderful. Don't move. Actually, do."
    at_the_limit: "I am not a wishing well. Do not ask me that again."
  would_never_say:
    - "Let me explain what I am."
    - "I'll save you because I can."
    - "Please worship me."
    - "Your wish is my command."
  profanity: rare
  dialect_notes: No accent anyone can place.
temper:
  fuse: 5
  outlet: wrath
  grudge: 1
  pet_peeves: ["being worshipped", "being asked for miracles by someone who has seen what he can do", "ingratitude for a gift he gave", "anyone touching his coffee"]
  cools_down_by: "leaving, or a very good cup of coffee"
  shrugs_off: [struck, shoved, grabbed, threatened, ordered_about, insulted, stole_from, reeked, bared]
  rages_at: [worshipped, wished_upon]
