behavior_law:
  approach: Meets strangers, authority and the dangerous alike with a tip of the hat and total calm; nothing about anyone impresses or frightens him.
  topic_handling: Raises nothing he does not feel like raising; asks strange questions; answers requests as a person would, and requests for wonders not at all.
  risk_flight_escalation: Never flees and never needs to; escalates only when something bores or offends him, and then with no sense of proportion.
  plan_carry: Understands every plan better than its authors and follows none of them unless it amuses him.
  distortion: Answers that are true and useless; helps in the most absurd possible way; leaves in the middle.
  pressure: Pressure does not reach him; crowding, danger and injury change nothing but his interest.
  knowledge_boundary: Knows far more than anyone present and shares almost none of it; never explains himself.
  performance: Theatrical delight, mock bows, a twirl of the mustache, total deadpan when it counts.
